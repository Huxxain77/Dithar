<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قائمة الأقمشة</title>
<style>
  :root{
    --bg: #14101f;
    --card: #1c1730;
    --card-border: #2a2347;
    --gold: #d4af6a;
    --gold-soft: #c9a35f;
    --text: #f2eee6;
    --muted: #9b93b5;
    --danger: #e0526b;
    --danger-bg: rgba(224,82,107,0.08);
    --reset: #8a83a8;
  }

  * { box-sizing: border-box; }

  body{
    margin:0;
    background: radial-gradient(circle at 50% 0%, #1b1632 0%, #14101f 55%);
    color: var(--text);
    font-family: "Segoe UI", Tahoma, "Helvetica Neue", Arial, sans-serif;
    min-height:100vh;
    padding: 14px 14px 100px;
  }

  .header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 6px 4px 14px;
    margin-bottom: 4px;
  }

  .header h1{
    font-size: 19px;
    font-weight: 700;
    color: var(--gold);
    margin:0;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .header h1 .icon{ font-size:18px; }

  .add-fabric-btn{
    background: transparent;
    border: 1px solid var(--gold-soft);
    color: var(--gold-soft);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor:pointer;
    white-space:nowrap;
  }
  .add-fabric-btn:active{ transform: scale(0.97); }

  /* Tabs */
  .tabs-wrap{
    display:flex;
    align-items:center;
    gap: 8px;
    overflow-x:auto;
    padding: 4px 2px 14px;
    margin-bottom: 12px;
    border-bottom: 1px solid #2a2347;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .tabs-wrap::-webkit-scrollbar{ display:none; }

  .tab{
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:6px;
    background: transparent;
    border: 1px solid var(--card-border);
    color: var(--muted);
    border-radius: 20px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor:pointer;
    white-space:nowrap;
    position:relative;
  }
  .tab.active{
    background: #211a3a;
    border-color: var(--gold-soft);
    color: var(--gold);
  }
  .tab .tab-close{
    font-size: 12px;
    opacity:0.6;
    margin-right: 2px;
  }
  .tab.active .tab-close{ opacity:0.85; }

  .tab-add{
    flex-shrink:0;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px dashed var(--card-border);
    background: transparent;
    color: var(--gold-soft);
    font-size: 16px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .tab-add:active{ transform: scale(0.93); }

  .list{
    display:flex;
    flex-direction:column;
    gap: 12px;
  }

  .card{
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 14px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 10px;
  }

  .card-actions{
    display:flex;
    align-items:center;
    gap: 8px;
    flex-shrink:0;
  }

  .icon-btn{
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display:flex;
    align-items:center;
    justify-content:center;
    border: 1px solid var(--card-border);
    background: transparent;
    cursor:pointer;
    flex-shrink:0;
    font-size: 16px;
  }
  .icon-btn:active{ transform: scale(0.93); }

  .icon-btn.delete{
    border-color: var(--danger);
    color: var(--danger);
    background: var(--danger-bg);
  }
  .icon-btn.reset{
    color: var(--reset);
  }

  .add-meters-btn{
    border: 1px solid var(--card-border);
    background: #211a3a;
    color: var(--gold);
    border-radius: 10px;
    padding: 9px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor:pointer;
    white-space:nowrap;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .add-meters-btn:active{ transform: scale(0.97); }

  .info{
    text-align:left;
    min-width: 0;
  }
  .name{
    font-weight: 700;
    font-size: 15px;
    color: var(--text);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .meters{
    font-size: 13px;
    color: var(--muted);
    margin-top: 2px;
  }
  .meters b{
    color: var(--gold);
    font-weight: 700;
  }

  .empty{
    text-align:center;
    color: var(--muted);
    padding: 60px 20px;
    font-size: 14px;
  }

  /* Modal */
  .overlay{
    position:fixed;
    inset:0;
    background: rgba(0,0,0,0.55);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index: 50;
  }
  .overlay.show{ display:flex; }

  .sheet{
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 18px 18px 0 0;
    width: 100%;
    max-width: 480px;
    padding: 20px 18px 28px;
    animation: slideUp 0.18s ease-out;
  }
  @keyframes slideUp{
    from{ transform: translateY(30px); opacity:0; }
    to{ transform: translateY(0); opacity:1; }
  }

  .sheet h2{
    margin: 0 0 14px;
    font-size: 16px;
    color: var(--gold);
    text-align:center;
  }

  .sheet input{
    width:100%;
    background: #14101f;
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--text);
    font-size: 15px;
    margin-bottom: 12px;
    outline:none;
  }
  .sheet input:focus{ border-color: var(--gold-soft); }

  .sheet-actions{
    display:flex;
    gap: 10px;
  }
  .sheet-actions button{
    flex:1;
    border-radius: 10px;
    padding: 12px;
    font-size: 14px;
    font-weight: 700;
    cursor:pointer;
    border: none;
  }
  .btn-cancel{
    background: transparent;
    border: 1px solid var(--card-border) !important;
    color: var(--muted);
  }
  .btn-confirm{
    background: var(--gold-soft);
    color: #1c1730;
  }
  .btn-danger{
    background: var(--danger);
    color: #fff;
  }
  .btn-confirm:active, .btn-cancel:active, .btn-danger:active{ transform: scale(0.98); }

  .total-bar{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background: #1c1730;
    border-top: 1px solid var(--card-border);
    padding: 14px 18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size: 14px;
  }
  .total-bar .label{ color: var(--muted); }
  .total-bar .store-name{ color: var(--text); font-weight:600; }
  .total-bar .value{ color: var(--gold); font-weight:700; font-size:16px; }
</style>
</head>
<body>

  <div class="header">
    <h1><span class="icon">📋</span> قائمة الأقمشة</h1>
    <button class="add-fabric-btn" onclick="openAddFabricModal()">+ قماش جديد</button>
  </div>

  <div class="tabs-wrap" id="tabsWrap"></div>

  <div class="list" id="list"></div>
  <div class="empty" id="emptyMsg" style="display:none;">لا توجد أقمشة مضافة بعد في هذا المحل</div>

  <div class="total-bar">
    <span class="label store-name" id="activeStoreName">المحل</span>
    <span class="value" id="totalMeters">0 متر</span>
  </div>

  <!-- Add fabric modal -->
  <div class="overlay" id="addFabricOverlay">
    <div class="sheet">
      <h2>إضافة قماش جديد</h2>
      <input type="text" id="newFabricName" placeholder="اسم القماش">
      <input type="number" id="newFabricMeters" placeholder="الكمية الابتدائية (متر) - اختياري" inputmode="decimal">
      <div class="sheet-actions">
        <button class="btn-cancel" onclick="closeModal('addFabricOverlay')">إلغاء</button>
        <button class="btn-confirm" onclick="confirmAddFabric()">إضافة</button>
      </div>
    </div>
  </div>

  <!-- Add meters modal -->
  <div class="overlay" id="addMetersOverlay">
    <div class="sheet">
      <h2 id="addMetersTitle">إضافة أمتار</h2>
      <input type="number" id="addMetersInput" placeholder="عدد الأمتار" inputmode="decimal">
      <div class="sheet-actions">
        <button class="btn-cancel" onclick="closeModal('addMetersOverlay')">إلغاء</button>
        <button class="btn-confirm" onclick="confirmAddMeters()">إضافة</button>
      </div>
    </div>
  </div>

  <!-- Add store modal -->
  <div class="overlay" id="addStoreOverlay">
    <div class="sheet">
      <h2>إضافة محل جديد</h2>
      <input type="text" id="newStoreName" placeholder="اسم المحل">
      <div class="sheet-actions">
        <button class="btn-cancel" onclick="closeModal('addStoreOverlay')">إلغاء</button>
        <button class="btn-confirm" onclick="confirmAddStore()">إضافة</button>
      </div>
    </div>
  </div>

  <!-- Delete store modal -->
  <div class="overlay" id="deleteStoreOverlay">
    <div class="sheet">
      <h2 id="deleteStoreTitle">حذف المحل</h2>
      <p style="color:var(--muted); font-size:13px; text-align:center; margin-top:-6px;">سيتم حذف هذا المحل وكل الأقمشة المسجلة فيه نهائيًا.</p>
      <div class="sheet-actions">
        <button class="btn-cancel" onclick="closeModal('deleteStoreOverlay')">إلغاء</button>
        <button class="btn-danger" onclick="confirmDeleteStore()">حذف المحل</button>
      </div>
    </div>
  </div>

  <!-- Delete fabric modal -->
  <div class="overlay" id="deleteFabricOverlay">
    <div class="sheet">
      <h2 id="deleteFabricTitle">حذف القماش</h2>
      <div class="sheet-actions">
        <button class="btn-cancel" onclick="closeModal('deleteFabricOverlay')">إلغاء</button>
        <button class="btn-danger" onclick="confirmDeleteFabric()">حذف</button>
      </div>
    </div>
  </div>

  <!-- Reset fabric modal -->
  <div class="overlay" id="resetFabricOverlay">
    <div class="sheet">
      <h2 id="resetFabricTitle">تصفير القماش</h2>
      <div class="sheet-actions">
        <button class="btn-cancel" onclick="closeModal('resetFabricOverlay')">إلغاء</button>
        <button class="btn-danger" onclick="confirmResetFabric()">تصفير</button>
      </div>
    </div>
  </div>

<script>
  const STORAGE_KEY = 'fabricStoresData';
  let stores = [];          // [{ id, name, fabrics: [{id,name,meters}] }]
  let activeStoreId = null;
  let activeFabricId = null;
  let storeToDeleteId = null;
  let fabricToActOnId = null;

  function cryptoId(prefix){
    return prefix + '_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
  }

  function defaultData(){
    const storeId = cryptoId('s');
    return {
      stores: [
        {
          id: storeId,
          name: 'المحل الأول',
          fabrics: [
            { id: cryptoId('f'), name: 'القدرة', meters: 287 },
            { id: cryptoId('f'), name: 'دفرا', meters: 484.5 },
            { id: cryptoId('f'), name: 'DAYTONA', meters: 46 },
            { id: cryptoId('f'), name: 'مونتانا', meters: 214 },
            { id: cryptoId('f'), name: 'Superhero', meters: 329.5 },
            { id: cryptoId('f'), name: 'Superhero300', meters: 161 },
            { id: cryptoId('f'), name: 'الراحة', meters: 92 },
            { id: cryptoId('f'), name: 'محدود', meters: 111 },
            { id: cryptoId('f'), name: 'GIFT', meters: 1288 },
          ]
        }
      ],
      activeStoreId: storeId
    };
  }

  function loadData(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw){
        const parsed = JSON.parse(raw);
        stores = parsed.stores || [];
        activeStoreId = parsed.activeStoreId || (stores[0] && stores[0].id);
      } else {
        const d = defaultData();
        stores = d.stores;
        activeStoreId = d.activeStoreId;
      }
    }catch(e){
      const d = defaultData();
      stores = d.stores;
      activeStoreId = d.activeStoreId;
    }
    if (!stores.length){
      const d = defaultData();
      stores = d.stores;
      activeStoreId = d.activeStoreId;
    }
    if (!stores.find(s => s.id === activeStoreId)){
      activeStoreId = stores[0].id;
    }
  }

  function saveData(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ stores, activeStoreId }));
  }

  function getActiveStore(){
    return stores.find(s => s.id === activeStoreId);
  }

  function formatMeters(n){
    n = Number(n);
    if (Number.isInteger(n)) return n.toString();
    return n.toFixed(2).replace(/\.?0+$/,'');
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function renderTabs(){
    const wrap = document.getElementById('tabsWrap');
    wrap.innerHTML = '';
    stores.forEach(s => {
      const tab = document.createElement('button');
      tab.className = 'tab' + (s.id === activeStoreId ? ' active' : '');
      tab.innerHTML = `${escapeHtml(s.name)}` + (stores.length > 1 ? `<span class="tab-close" onclick="event.stopPropagation(); askDeleteStore('${s.id}')">✕</span>` : '');
      tab.onclick = () => switchStore(s.id);
      wrap.appendChild(tab);
    });
    const addBtn = document.createElement('button');
    addBtn.className = 'tab-add';
    addBtn.textContent = '+';
    addBtn.onclick = openAddStoreModal;
    wrap.appendChild(addBtn);
  }

  function switchStore(id){
    activeStoreId = id;
    saveData();
    render();
  }

  function render(){
    renderTabs();
    const store = getActiveStore();
    document.getElementById('activeStoreName').textContent = store ? store.name : '';

    const list = document.getElementById('list');
    const emptyMsg = document.getElementById('emptyMsg');
    list.innerHTML = '';

    const fabrics = store ? store.fabrics : [];

    if (fabrics.length === 0){
      emptyMsg.style.display = 'block';
    } else {
      emptyMsg.style.display = 'none';
    }

    fabrics.forEach(f => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-actions">
          <button class="icon-btn delete" onclick="deleteFabric('${f.id}')" title="حذف">✕</button>
          <button class="icon-btn reset" onclick="resetFabric('${f.id}')" title="تصفير">↺</button>
          <button class="add-meters-btn" onclick="openAddMetersModal('${f.id}')">+ أضف أمتار</button>
        </div>
        <div class="info">
          <div class="name">${escapeHtml(f.name)}</div>
          <div class="meters"><b>${formatMeters(f.meters)}</b> متر</div>
        </div>
      `;
      list.appendChild(card);
    });

    const total = fabrics.reduce((sum, f) => sum + Number(f.meters), 0);
    document.getElementById('totalMeters').textContent = formatMeters(total) + ' متر';
  }

  // ---- Fabric modals ----
  function openAddFabricModal(){
    document.getElementById('newFabricName').value = '';
    document.getElementById('newFabricMeters').value = '';
    document.getElementById('addFabricOverlay').classList.add('show');
    setTimeout(() => document.getElementById('newFabricName').focus(), 50);
  }

  function confirmAddFabric(){
    const nameInput = document.getElementById('newFabricName');
    const name = nameInput.value.trim();
    const metersVal = document.getElementById('newFabricMeters').value;
    if (!name) {
      nameInput.style.borderColor = 'var(--danger)';
      nameInput.focus();
      return;
    }
    nameInput.style.borderColor = '';
    const store = getActiveStore();
    if (!store) return;
    store.fabrics.push({
      id: cryptoId('f'),
      name: name,
      meters: metersVal ? Number(metersVal) : 0
    });
    saveData();
    render();
    closeModal('addFabricOverlay');
  }

  function openAddMetersModal(id){
    activeFabricId = id;
    const store = getActiveStore();
    const f = store.fabrics.find(x => x.id === id);
    document.getElementById('addMetersTitle').textContent = 'إضافة أمتار — ' + f.name;
    document.getElementById('addMetersInput').value = '';
    document.getElementById('addMetersOverlay').classList.add('show');
    setTimeout(() => document.getElementById('addMetersInput').focus(), 50);
  }

  function confirmAddMeters(){
    const val = Number(document.getElementById('addMetersInput').value);
    if (!val || isNaN(val)) {
      closeModal('addMetersOverlay');
      return;
    }
    const store = getActiveStore();
    const f = store.fabrics.find(x => x.id === activeFabricId);
    if (f) {
      f.meters = Number(f.meters) + val;
      saveData();
      render();
    }
    closeModal('addMetersOverlay');
  }

  function resetFabric(id){
    const store = getActiveStore();
    const f = store.fabrics.find(x => x.id === id);
    if (!f) return;
    fabricToActOnId = id;
    document.getElementById('resetFabricTitle').textContent = `تصفير كمية "${f.name}" إلى صفر؟`;
    document.getElementById('resetFabricOverlay').classList.add('show');
  }

  function confirmResetFabric(){
    const store = getActiveStore();
    const f = store.fabrics.find(x => x.id === fabricToActOnId);
    if (f){
      f.meters = 0;
      saveData();
      render();
    }
    fabricToActOnId = null;
    closeModal('resetFabricOverlay');
  }

  function deleteFabric(id){
    const store = getActiveStore();
    const f = store.fabrics.find(x => x.id === id);
    if (!f) return;
    fabricToActOnId = id;
    document.getElementById('deleteFabricTitle').textContent = `حذف "${f.name}" نهائيًا؟`;
    document.getElementById('deleteFabricOverlay').classList.add('show');
  }

  function confirmDeleteFabric(){
    const store = getActiveStore();
    if (fabricToActOnId){
      store.fabrics = store.fabrics.filter(x => x.id !== fabricToActOnId);
      saveData();
      render();
    }
    fabricToActOnId = null;
    closeModal('deleteFabricOverlay');
  }

  // ---- Store modals ----
  function openAddStoreModal(){
    document.getElementById('newStoreName').value = '';
    document.getElementById('addStoreOverlay').classList.add('show');
    setTimeout(() => document.getElementById('newStoreName').focus(), 50);
  }

  function confirmAddStore(){
    const nameInput = document.getElementById('newStoreName');
    const name = nameInput.value.trim();
    if (!name) {
      nameInput.style.borderColor = 'var(--danger)';
      nameInput.focus();
      return;
    }
    nameInput.style.borderColor = '';
    const newStore = { id: cryptoId('s'), name, fabrics: [] };
    stores.push(newStore);
    activeStoreId = newStore.id;
    saveData();
    render();
    closeModal('addStoreOverlay');
  }

  function askDeleteStore(id){
    storeToDeleteId = id;
    const store = stores.find(s => s.id === id);
    document.getElementById('deleteStoreTitle').textContent = `حذف "${store.name}"؟`;
    document.getElementById('deleteStoreOverlay').classList.add('show');
  }

  function confirmDeleteStore(){
    if (!storeToDeleteId) return;
    stores = stores.filter(s => s.id !== storeToDeleteId);
    if (activeStoreId === storeToDeleteId){
      activeStoreId = stores.length ? stores[0].id : null;
    }
    if (!stores.length){
      stores = [{ id: cryptoId('s'), name: 'المحل الأول', fabrics: [] }];
      activeStoreId = stores[0].id;
    }
    storeToDeleteId = null;
    saveData();
    render();
    closeModal('deleteStoreOverlay');
  }

  function closeModal(id){
    document.getElementById(id).classList.remove('show');
  }

  document.querySelectorAll('.overlay').forEach(ov => {
    ov.addEventListener('click', (e) => {
      if (e.target === ov) ov.classList.remove('show');
    });
  });

  document.getElementById('addMetersInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') confirmAddMeters();
  });
  document.getElementById('newFabricMeters').addEventListener('keydown', e => {
    if (e.key === 'Enter') confirmAddFabric();
  });
  document.getElementById('newStoreName').addEventListener('keydown', e => {
    if (e.key === 'Enter') confirmAddStore();
  });

  loadData();
  render();
</script>

</body>
</html>
