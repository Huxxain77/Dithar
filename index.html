        months.slice().reverse().map(function(m,i){return '<label><span>'+esc(monthName(m.key))+' <small>('+m.days.length+' يوم به أرقام)</small></span><input type="radio" name="m" value="'+m.key+'"'+(i===0?' checked':'')+'></label>'}).join('')+'</div>';
      var r=await modal({title:'أي شهر تريد استيراده؟',body:'<p>وُجدت هذه الأشهر في الملف:</p>'+opts,actions:[{key:'ok',label:'التالي'},{key:'cancel',label:'إلغاء',cls:'ghost'}]});
      if(!r)return;sel=r.values.m==='all'?months:months.filter(function(m){return m.key===r.values.m});if(!sel.length)return}
    // نجيب بيانات الأشهر من القاعدة عشان نعرف الأيام المسجلة من قبل
    var keys=sel.map(function(m){return m.key}).sort();
    if(typeof ensureRange==='function'){try{await ensureRange(keys[0]+'-01',monthBounds(keys[keys.length-1])[1])}catch(e){}}
    if(store.root&&typeof LOADED!=='undefined'&&keys.some(function(k){return k<CUTOFF_M&&LOADED[k]!==true})){toast('تعذّر التحقق من البيانات السابقة، تأكد من الاتصال بالإنترنت وحاول مرة أخرى');return}
    var have={};S.entries.forEach(function(x){have[x.date]=1});
    var add=[],skipped=[];
    sel.forEach(function(m){m.days.forEach(function(d){if(have[d.date])skipped.push(d.date);else add=add.concat(d.items)})});
    if(!add.length){await modal({title:'لا توجد بيانات جديدة',body:'<p>جميع أيام الملف مسجلة في التطبيق مسبقًا ('+skipped.length+' يوم).</p>',actions:[{key:'ok',label:'حسنًا'}]});return}
    var t={mada:0,visa:0,cash:0,out:0},notes=[];
    add.forEach(function(x){if(x.kind==='in')t[x.method]+=x.amount;else t.out+=x.amount;if(x.note)notes.push((x.kind==='out'?'مصروف ':ML[x.method]+' ')+fmt(x.amount)+': '+esc(x.note)+' <small>('+fmtShort(x.date)+')</small>')});
    var dcount=new Set(add.map(function(x){return x.date})).size;
    var body='<p>'+esc(sel.length>1?sel.length+' أشهر':monthName(sel[0].key))+': <b>'+dcount+'</b> يوم، <b>'+add.length+'</b> حركة.</p>'+
      (skipped.length?'<p class="xl-warn">سيتم تخطي '+skipped.length+' يوم لأنها مسجلة في التطبيق مسبقًا.</p>':'')+
      '<div class="xl-sum"><span>مدى</span><b>'+fmt(t.mada)+'</b><span>فيزا</span><b>'+fmt(t.visa)+'</b><span>كاش</span><b>'+fmt(t.cash)+'</b><span>المصروفات</span><b>'+fmt(t.out)+'</b></div>'+
      (notes.length?'<p style="margin:0 0 4px"><b>'+notes.length+'</b> ملاحظة قُرئت من الملف:</p><ul class="xl-notes">'+notes.map(function(n){return '<li>'+n+'</li>'}).join('')+'</ul>':'')+
      '<p style="font-size:.8rem;color:var(--muted);margin:10px 0 0">عمود السحبيات والرواتب لا يُستورد.</p>';
    var ok=await modal({title:'تأكيد الاستيراد',body:body,actions:[{key:'ok',label:'استيراد '+add.length+' حركة'},{key:'cancel',label:'إلغاء',cls:'ghost'}]});
    if(!ok)return;
    var ids=[];
    var done=await safe(async function(){for(var i=0;i<add.length;i++){var id=await store.add('entries',add[i]);if(id)ids.push(id)}});
    if(!done&&!ids.length)return;
    var tt=$('#toast');clearTimeout(toastT);
    tt.innerHTML='<span>تم استيراد '+ids.length+' حركة</span><button type="button" class="undo-btn">تراجع</button>';tt.classList.add('undo','show');
    var used=false;tt.querySelector('.undo-btn').onclick=async function(){if(used)return;used=true;tt.classList.remove('show','undo');
      if(await safe(async function(){for(var i=0;i<ids.length;i++)await store.remove('entries',ids[i])}))toast('تم التراجع عن الاستيراد')};
    toastT=setTimeout(function(){tt.classList.remove('show','undo')},10000);
  }
  ACT.xlImport=function(){runImport()};
  if(typeof UI!=='undefined'&&UI.tab==='branches'&&!UI.detail&&typeof mount==='function')mount();
})();
</script>
<!-- ===== نهاية الاستيراد ===== -->
<!-- ===== التقرير السنوي ===== -->
<style>
.yr-bar{display:flex;align-items:center;gap:8px;margin-bottom:16px}.yr-bar strong{flex:1;text-align:center;font-size:1.15rem}
.yr-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:0 0 14px}
.yr-stats div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.yr-stats span{display:block;color:var(--muted);font-size:.8rem}.yr-stats b{font-size:1.15rem;font-weight:600}
.yr-tbl td.cur,.yr-tbl th.cur{font-weight:600}
.yr-tbl tr.future td{color:var(--muted)}
@media print{.yr-stats{grid-template-columns:repeat(4,1fr)}}
.pdf-mode .yr-stats{grid-template-columns:repeat(4,1fr)}
</style>
<script>
(function(){
  if(typeof VIEWS==='undefined')return;
  var C={bar:'#7A2236',barSoft:'#C9A3AC',grid:'#EEEDF4',muted:'#6A6884',ink:'#1D1B36'};
  var Wd=360,Hd=190,P={l:36,r:8,t:22,b:24};
  var kf=function(v){var a=Math.abs(v);return a>=1000?(v/1000).toLocaleString('en-US',{maximumFractionDigits:a>=100000?0:1})+'k':String(Math.round(v))};
  var step=function(span){var raw=span/4,p=Math.pow(10,Math.floor(Math.log10(raw||1))),m=raw/p;return(m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10)*p};
  var yearOf=function(){return UI.year||+today().slice(0,4)};
  var monthsOfYear=function(y){var o=[];for(var i=1;i<=12;i++)o.push(y+'-'+(i<10?'0':'')+i);return o};
  var missing=function(y){if(!store.root||typeof LOADED==='undefined'||typeof CUTOFF_M==='undefined')return false;
    return monthsOfYear(y).some(function(m){return m<CUTOFF_M&&m<=curMonth()&&LOADED[m]!==true})};
  function rowFor(m){var b=monthBounds(m),a=b[0],e=b[1];if(m>curMonth())return{m:m,future:true};
    var T=sumEntries(S.entries.filter(function(x){return inRange(x.date,a,e)}));
    var wages=0;S.workers.forEach(function(w){wages+=workerTotals(w.id,a,e).salary});
    var rep=0;S.reps.forEach(function(r){rep+=repTotals(r.id,a,e).paid});
    return{m:m,T:T,inNet:T.in-T.fee,wages:wages,rep:rep,shop:T.in-T.fee-T.out,fin:T.in-T.fee-T.out-wages-rep}}

  VIEWS.year={
    html:function(){return '<div class="detail-top no-print"><button class="back" data-act="back">'+svg('prev')+'التقرير الشهري</button></div>'+
      '<div class="print-head"><div><strong>Dithar</strong><span>التقرير السنوي</span></div><div id="yPeriod"></div></div>'+
      '<div class="page-head"><div><h1>التقرير السنوي</h1><p class="sub" id="ySub"></p></div><button class="btn no-print" data-act="printYear">طباعة / حفظ PDF</button></div>'+
      '<div class="yr-bar no-print"><button class="icon-btn" data-act="yearShift" data-n="-1" aria-label="السنة السابقة">'+svg('prev')+'</button><strong id="yLabel"></strong><button class="icon-btn" data-act="yearShift" data-n="1" aria-label="السنة التالية">'+svg('next')+'</button></div>'+
      '<div class="yr-stats" id="yStats"></div>'+
      '<h2 class="section-title">مقارنة الأشهر</h2><section class="charts"><div class="chart-card"><h3>الدخل لكل شهر</h3><p class="note">كاش + مدى + فيزا بعد خصم العمولة، بدون المصروفات</p><div class="chart-box" id="yChart"></div>'+
      '<div class="chart-legend"><span><i style="background:'+C.bar+'"></i>دخل الشهر</span><span><i class="ln" style="border-color:'+C.muted+';border-top-style:dashed"></i>متوسط الأشهر</span></div></div></section>'+
      '<h2 class="section-title pdf-newpage">تفاصيل كل شهر</h2><section class="panel"><div class="tbl-wrap" id="yTable">'+loading+'</div></section>'},
    update:function(){
      var y=yearOf();$('#yLabel').textContent=y;$('#ySub').textContent='يناير – ديسمبر '+y;
      var pp=$('#yPeriod');if(pp)pp.innerHTML='<span>السنة: '+y+'</span><span>تاريخ الطباعة: '+fmtDay(today())+'</span>';
      if(missing(y)){$('#yTable').innerHTML='<p class="empty">جارٍ جلب بيانات الأشهر القديمة…</p>';$('#yChart').innerHTML='';$('#yStats').innerHTML='';return}
      var rows=monthsOfYear(y).map(rowFor),hasIn=rows.filter(function(r){return !r.future&&r.inNet>0}),full=hasIn.filter(function(r){return r.m<curMonth()}),done=full.length?full:hasIn;   // الشهر الحالي ما يدخل في المتوسط وأعلى/أقل شهر لأنه ما خلص
      var sumK=function(f){return rows.reduce(function(t,r){return t+(r.future?0:f(r))},0)};
      var tin=sumK(function(r){return r.inNet}),avg=done.length?tin/done.length:0;
      var best=done.slice().sort(function(a,b){return b.inNet-a.inNet})[0],worst=done.slice().sort(function(a,b){return a.inNet-b.inNet})[0];
      var mname=function(m){return parseD(m+'-01').toLocaleDateString(LOC,{month:'long'})};
      $('#yStats').innerHTML='<div><span>دخل السنة بعد العمولة</span><b>'+fmt(tin)+'</b> <small>ر.س</small></div><div><span>متوسط الشهر</span><b>'+fmt(Math.round(avg))+'</b> <small>ر.س</small></div>'+
        '<div><span>أعلى شهر</span><b>'+(best?mname(best.m):'—')+'</b>'+(best?' <small>'+fmt(best.inNet)+'</small>':'')+'</div><div><span>أقل شهر</span><b>'+(worst?mname(worst.m):'—')+'</b>'+(worst?' <small>'+fmt(worst.inNet)+'</small>':'')+'</div>';
      // الرسم: عمود لكل شهر مع الرقم فوقه
      var box=$('#yChart');
      if(!hasIn.length)box.innerHTML='<p class="chart-empty">لا يوجد دخل مسجل في '+y+'.</p>';
      else{var mx=Math.max.apply(null,hasIn.map(function(r){return r.inNet})),st=step(mx),top=Math.ceil(mx*1.12/st)*st,iw=Wd-P.l-P.r,ih=Hd-P.t-P.b,bw=iw/12;
        var yy=function(v){return P.t+ih-v/top*ih},s='<svg viewBox="0 0 '+Wd+' '+Hd+'" direction="ltr" role="img" aria-label="الدخل لكل شهر">';
        for(var g=0;g<=top+1e-9;g+=st)s+='<line x1="'+P.l+'" x2="'+(Wd-P.r)+'" y1="'+yy(g)+'" y2="'+yy(g)+'" stroke="'+(g===0?'#D5D3E2':C.grid)+'"/><text x="'+(P.l-6)+'" y="'+(yy(g)+3.5)+'" font-size="10" fill="'+C.muted+'" text-anchor="end">'+kf(g)+'</text>';
        rows.forEach(function(r,i){var x=P.l+i*bw+2,w=bw-4,cx=x+w/2;
          s+='<text x="'+cx+'" y="'+(Hd-7)+'" font-size="9.5" fill="'+C.muted+'" text-anchor="middle">'+(i+1)+'</text>';
          if(r.future||!r.inNet)return;var t0=yy(r.inNet),h=P.t+ih-t0,rr=Math.min(3,w/2,h);
          s+='<path d="M'+x+','+(P.t+ih)+'V'+(t0+rr)+'q0,-'+rr+' '+rr+',-'+rr+'h'+(w-2*rr)+'q'+rr+',0 '+rr+','+rr+'V'+(P.t+ih)+'z" fill="'+(r.m===curMonth()?C.barSoft:C.bar)+'"/>';
          s+='<text x="'+cx+'" y="'+(t0-4)+'" font-size="9" font-weight="'+(r===best?'700':'500')+'" fill="'+C.ink+'" text-anchor="middle">'+kf(r.inNet)+'</text>'});
        s+='<line x1="'+P.l+'" x2="'+(Wd-P.r)+'" y1="'+yy(avg)+'" y2="'+yy(avg)+'" stroke="'+C.muted+'" stroke-dasharray="4 3" stroke-width="1.2"/>';
        box.innerHTML=s+'</svg>'+(rows.some(function(r){return r.m===curMonth()})?'<p class="note" style="margin:6px 0 0">العمود الفاتح هو الشهر الحالي، ولم ينتهِ بعد.</p>':'')}
      // الجدول
      var c=function(v,k){return '<td class="num '+(k||'')+'">'+fmt(v)+'</td>'};
      $('#yTable').innerHTML=withFootHead('<table class="yr-tbl"><thead><tr><th>الشهر</th><th class="num">كاش</th><th class="num">مدى</th><th class="num">فيزا</th><th class="num">الدخل</th><th class="num">العمولة</th><th class="num">المصروفات</th><th class="num">صافي المحل</th><th class="num">رواتب العمال</th><th class="num">المناديب</th><th class="num">الصافي النهائي</th></tr></thead><tbody>'+
        rows.map(function(r){if(r.future)return '<tr class="future"><td>'+mname(r.m)+'</td><td colspan="10" class="num">—</td></tr>';
          return '<tr><td>'+mname(r.m)+'</td>'+c(r.T.cash)+c(r.T.mada)+c(r.T.visa)+c(r.T.in,'pos')+c(r.T.fee,'neg')+c(r.T.out,'neg')+c(r.shop)+c(r.wages,'neg')+c(r.rep,'neg')+'<td class="num cur">'+fmt(r.fin)+'</td></tr>'}).join('')+
        '</tbody><tfoot><tr><td>الإجمالي</td>'+c(sumK(function(r){return r.T.cash}))+c(sumK(function(r){return r.T.mada}))+c(sumK(function(r){return r.T.visa}))+c(tin,'pos')+c(sumK(function(r){return r.T.fee}),'neg')+c(sumK(function(r){return r.T.out}),'neg')+c(sumK(function(r){return r.shop}))+c(sumK(function(r){return r.wages}),'neg')+c(sumK(function(r){return r.rep}),'neg')+'<td class="num cur">'+fmt(sumK(function(r){return r.fin}))+'</td></tr></tfoot></table>');
    }
  };
  var doPrintYear=function(){if(missing(yearOf())){toast('انتظر حتى تكتمل بيانات السنة');return}refresh();if(usePDF()){sharePDF('Dithar-'+yearOf());return}setTimeout(function(){window.print()},50)};
  ACT.yearShift=function(t){UI.year=yearOf()+(+t.dataset.n);refresh()};
  ACT.printYear=doPrintYear;
  ACT.openYear=function(){UI.year=+UI.rFrom.slice(0,4)||yearOf();go('report',{type:'year'})};
  var monthly=ACT.printReport;
  ACT.printReport=async function(){
    var r=await modal({title:'ماذا تريد أن تطبع؟',body:'<p>التقرير الشهري للفترة التي اخترتها، أو التقرير السنوي كاملًا مع مقارنة الأشهر بالرسم.</p>',
      actions:[{key:'month',label:'التقرير الشهري'},{key:'year',label:'التقرير السنوي '+(+UI.rFrom.slice(0,4)||yearOf())},{key:'cancel',label:'إلغاء',cls:'ghost'}]});
    if(!r)return;if(r.key==='month'){monthly();return}
    UI.year=+UI.rFrom.slice(0,4)||yearOf();go('report',{type:'year'});
    var tries=0;(function wait(){if(missing(UI.year)&&tries++<60){setTimeout(wait,500);return}setTimeout(doPrintYear,300)})();
  };
})();
</script>
<!-- ===== نهاية التقرير السنوي ===== -->
</body>
