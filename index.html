<style>
:root{
  --bg:#F1F1F6;--surface:#FFFFFF;--surface-2:#F6F6FA;--ink:#1D1B36;--muted:#6A6884;--line:#E1E0EC;
  --brass:#A77826;--brass-soft:#F5EBD7;--pos:#2B7A57;--pos-soft:#E3F2EA;--neg:#B5443A;--neg-soft:#F8E6E3;--focus:#5B4FD6;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131229;--surface:#1C1A37;--surface-2:#242247;--ink:#ECEAF8;--muted:#A3A1C4;--line:#302E57;
    --brass:#DDB264;--brass-soft:#3A3122;--pos:#62C79A;--pos-soft:#1C3A2E;--neg:#F08A7E;--neg-soft:#41232A;--focus:#A49CFF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131229;--surface:#1C1A37;--surface-2:#242247;--ink:#ECEAF8;--muted:#A3A1C4;--line:#302E57;
  --brass:#DDB264;--brass-soft:#3A3122;--pos:#62C79A;--pos-soft:#1C3A2E;--neg:#F08A7E;--neg-soft:#41232A;--focus:#A49CFF;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;background:#F1F1F6!important;color-scheme:light only}
html,body{min-height:100%}
body{margin:0;min-height:100vh;min-height:100dvh;background:#F1F1F6!important;color:var(--ink);font-family:"Readex Pro","IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;font-size:16px;line-height:1.55;font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:600}
small{font-size:.72em;color:var(--muted);font-weight:400}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar-in{max-width:960px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:1.05rem}
.brand-mark{width:32px;height:32px;border-radius:10px;background:var(--ink);color:var(--bg);display:grid;place-items:center}
.brand-mark svg{width:18px;height:18px}
.brand-logo{width:38px;height:38px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:#34161B;object-fit:cover;flex:none}
.topnav{display:none;gap:2px}
.top-end{margin-inline-start:auto;display:flex;align-items:center;gap:8px}
.top-end .btn{height:38px;padding:0 14px}
[hidden]{display:none!important}
.login{max-width:400px;margin:6vh auto 0}
.topnav button{appearance:none;border:0;background:none;padding:8px 14px;border-radius:10px;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:8px;position:relative}
.topnav button svg{width:18px;height:18px}
.topnav button:hover{color:var(--ink);background:var(--surface-2)}
.topnav button[aria-current="page"]{color:var(--ink);font-weight:500}
.topnav button[aria-current="page"]::after{content:"";position:absolute;bottom:-13px;left:12px;right:12px;border-top:2px dashed var(--brass)}

.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar button{appearance:none;border:0;background:none;color:var(--muted);font-size:.74rem;padding:10px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;cursor:pointer}
.tabbar button svg{width:22px;height:22px}
@media (min-width:600px){.tabbar button{font-size:.85rem;padding:12px 4px 11px}}
.tabbar button[aria-current="page"]{color:var(--ink);font-weight:500}
.tabbar button[aria-current="page"]::before{content:"";position:absolute;top:0;left:24%;right:24%;border-top:2px dashed var(--brass)}

main{max-width:1180px;margin:0 auto;padding:22px max(16px,env(safe-area-inset-right,0px)) 110px max(16px,env(safe-area-inset-left,0px))}
.topbar-in{max-width:1180px!important}
@media (min-width:600px){main{padding-top:28px;padding-inline:24px}.page-head h1{font-size:1.9rem}}
@media (min-width:1024px){main{padding-inline:32px}body{font-size:17px}}
@media (min-width:760px){.topnav{display:flex}.tabbar{display:none}main{padding-bottom:56px}}

/* page head */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.page-head h1{font-size:1.7rem;line-height:1.25}
.page-head h1::after{content:"";display:block;width:56px;border-top:2px dashed var(--brass);margin-top:10px}
.sub{margin:6px 0 0;color:var(--muted);font-size:.92rem}
.detail-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.back{appearance:none;border:0;background:none;color:var(--muted);padding:6px 0;display:flex;align-items:center;gap:4px;cursor:pointer;font-size:.95rem}
.back:hover{color:var(--ink)}
.back svg{width:18px;height:18px}

/* buttons */
.btn{appearance:none;border:1px solid transparent;background:var(--ink);color:var(--bg);border-radius:11px;padding:0 18px;height:46px;font-weight:500;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:translateY(1px)}
.btn.brass{background:var(--brass);color:#1D1B36}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.danger{background:var(--neg);color:#fff}
.btn.danger-ghost{background:transparent;color:var(--neg);border-color:var(--line)}
.btn.block{width:100%}
.icon-btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);width:40px;height:40px;border-radius:11px;display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn:hover{color:var(--ink)}
.icon-btn svg{width:18px;height:18px}
.icon-btn.sm{width:32px;height:32px;border-radius:9px;border-color:transparent;background:transparent}
.icon-btn.sm:hover{background:var(--neg-soft);color:var(--neg)}

/* list cards */
.list{display:grid;gap:10px}
@media (min-width:600px){.list{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}}
.row-card{appearance:none;text-align:start;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer}
@media (hover:hover){.row-card:hover{border-color:var(--brass)}}
.row-card:active{border-color:var(--brass)}
.row-card h3{font-size:1.08rem;font-weight:500}
.row-meta{color:var(--muted);font-size:.85rem;margin-top:4px;display:flex;gap:12px;flex-wrap:wrap}
.row-val{text-align:end;flex:none}
.row-val strong{display:block;font-size:1.15rem;font-weight:600}
.row-val span{font-size:.78rem;color:var(--muted)}

/* panels & forms */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
.panel h2{font-size:1.05rem;margin-bottom:12px}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.panel-head h2{margin:0}
.panel-head span{color:var(--muted);font-size:.86rem}
.grid2{display:grid;gap:14px;margin-bottom:14px}
.grid2 .panel{margin:0}
.grid1{margin-bottom:14px}.grid1 .panel{margin:0}
@media (min-width:640px){.grid2{grid-template-columns:1fr 1fr}}
.field{display:block;margin-bottom:10px}
.field>span{display:block;font-size:.82rem;color:var(--muted);margin-bottom:5px}
input[type=text],input[type=password],input[type=email],input[type=date],input[type=month]{width:100%;height:46px;border:1px solid var(--line);background:var(--surface-2);border-radius:11px;padding:0 12px;font-size:16px;min-width:0}
/* آيفون: حقول التاريخ لها عرض داخلي يطلعها برا الشاشة */
input[type=date],input[type=month]{-webkit-appearance:none;appearance:none;display:block;max-width:100%;line-height:44px}
input[type=date]::-webkit-date-and-time-value,input[type=month]::-webkit-date-and-time-value{text-align:center;margin:0;min-width:0}
/* الصفحة تتحرك فوق وتحت بس */
html,body{overflow-x:clip;overscroll-behavior:none}
#view{will-change:transform}
@supports not (overflow-x:clip){body{overflow-x:hidden}}
input:focus{border-color:var(--focus);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 22%,transparent)}
input.err{border-color:var(--neg);box-shadow:0 0 0 3px color-mix(in srgb,var(--neg) 20%,transparent)}
.inline{display:flex;gap:8px}
.inline input{flex:1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.preview{min-height:1.4em;font-size:.86rem;color:var(--brass);margin:-2px 0 10px}

.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;margin-bottom:10px}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;inset:0;cursor:pointer}
.seg span{display:block;text-align:center;padding:8px 4px;border-radius:9px;color:var(--muted);font-size:.95rem}
.seg input:checked+span{background:var(--ink);color:var(--bg);font-weight:500}
.seg input:focus-visible+span{outline:2px solid var(--focus)}

/* date bar */
.date-bar{display:flex;gap:8px;align-items:center;margin-bottom:16px}
.date-bar input{flex:1;max-width:260px}
.date-bar .btn{height:40px;padding:0 14px}
@media (max-width:480px){.day-bar{gap:5px}.day-bar .icon-btn{width:36px}.day-bar .btn{padding:0 10px}.day-bar input{padding:0 6px!important}}
/* ما يتحدد النص بالضغط المطول، إلا داخل الخانات */
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input,textarea,[contenteditable]{-webkit-user-select:text;user-select:text}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:14px}
.stat{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.stat span{display:block;font-size:.78rem;color:var(--muted)}
.stat strong{font-size:1.15rem;font-weight:600}
.stat.pos strong{color:var(--pos)}
.stat.neg strong{color:var(--neg)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 12px}
.chip{font-size:.8rem;background:var(--surface-2);border-radius:999px;padding:3px 10px;color:var(--muted)}
.chip b{color:var(--ink);font-weight:500}

/* stitched hero: the one memorable element */
.hero{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px 22px;margin-bottom:14px}
.hero::after{content:"";position:absolute;inset:7px;border:1.5px dashed var(--brass);border-radius:14px;pointer-events:none;opacity:.75}
.hero-label{color:var(--muted);font-size:.9rem}
.hero-num{display:block;font-size:2.6rem;font-weight:600;line-height:1.2;margin:4px 0 10px;letter-spacing:-.01em}
.hero-num small{font-size:.38em}
.hero-row{display:flex;gap:18px;flex-wrap:wrap;font-size:.88rem;color:var(--muted)}
.hero-row b{color:var(--ink);font-weight:500}

/* items */
.item{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item-main{flex:1;min-width:0}
.item-title{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item-note{color:var(--muted);font-size:.85rem;overflow-wrap:anywhere}
.item-amt{font-weight:600;flex:none}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.tag{font-size:.76rem;padding:2px 9px;border-radius:999px;font-weight:500}
.tag.in{background:var(--pos-soft);color:var(--pos)}
.tag.out{background:var(--neg-soft);color:var(--neg)}
.tag.brass{background:var(--brass-soft);color:var(--brass)}
.empty{color:var(--muted);text-align:center;padding:20px 8px;margin:0;font-size:.92rem}
.empty-big{background:var(--surface);border:1.5px dashed var(--line);border-radius:18px;padding:36px 20px;text-align:center;color:var(--muted)}
.empty-big p{margin:0 0 14px}

/* tables */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:.9rem;min-width:520px}
th{font-weight:500;color:var(--muted);font-size:.78rem;text-align:start;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td.num,th.num{text-align:end}
tbody tr:last-child td{border-bottom:0}
tfoot td{font-weight:600;border-top:2px dashed var(--brass);border-bottom:0;padding-top:12px}
.linkish{appearance:none;border:0;background:none;padding:0;cursor:pointer;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
.linkish:hover{text-decoration-color:var(--brass)}
tr.sel td{background:var(--brass-soft)}

.section-title{font-size:1.2rem;margin:26px 0 12px;display:flex;align-items:center;gap:10px}
.section-title::before{content:"";width:18px;border-top:2px dashed var(--brass)}
.range{display:grid;gap:8px;grid-template-columns:1fr;margin-bottom:6px}
@media (min-width:600px){.range{grid-template-columns:1.2fr 1fr 1fr;gap:12px}}
@media (min-width:900px){table{font-size:.95rem}td{padding:12px 10px}}

.loading{color:var(--muted);padding:24px 0;text-align:center}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,9,25,.48);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
@media (min-width:600px){.scrim{align-items:center}}
.dialog{background:var(--surface);border-radius:20px;padding:22px;width:100%;max-width:420px;border:1px solid var(--line);animation:pop .18s ease-out}
.dialog h3{font-size:1.15rem;margin-bottom:12px}
.dialog p{margin:0 0 12px;color:var(--muted)}
.mact{display:flex;flex-direction:column;gap:8px;margin-top:16px}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:.92rem;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.toast.undo{pointer-events:auto;display:flex;align-items:center;gap:14px;padding:8px 18px 8px 8px}
.toast .undo-btn{appearance:none;border:0;border-radius:9px;background:#E6BE6E;color:#1D1B36;font:inherit;font-weight:600;padding:7px 16px;cursor:pointer}
.sync{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;height:34px;padding:0 12px;display:flex;align-items:center;gap:7px;font-size:.8rem;color:var(--muted);cursor:pointer;white-space:nowrap;flex:none}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sync[data-s="synced"] i{background:var(--pos)}
.sync[data-s="saving"] i,.sync[data-s="connecting"] i{background:var(--brass);animation:blink 1s ease-in-out infinite}
.sync[data-s="offline"] i{background:var(--brass)}
.sync[data-s="offline"]{color:var(--brass);border-color:var(--brass-soft);background:var(--brass-soft)}
.sync[data-s="error"] i{background:var(--neg)}
.sync[data-s="error"]{color:var(--neg);border-color:var(--neg-soft);background:var(--neg-soft)}
@keyframes blink{50%{opacity:.25}}
.info-rows{display:grid;gap:8px;margin:0 0 6px}
.info-rows div{display:flex;justify-content:space-between;gap:10px;background:var(--surface-2);border-radius:10px;padding:9px 12px;font-size:.92rem}
.info-rows b{font-weight:500}
.login{max-width:400px;margin:6vh auto 0}
.login .btn{width:100%}
.pw-wrap{position:relative;display:block}.pw-wrap input{padding-right:46px!important}

<script type="module" onerror="window.dispatchEvent(new Event('fb-fail'))">

const Q=(ref,cons)=>cons.length?query(ref,...cons):ref;
const wrapQ=(ref,cons=[])=>({where:(f,op,v)=>wrapQ(ref,cons.concat([where(f,op,v)])),get:()=>getDocs(Q(ref,cons)),onSnapshot:(opts,next,err)=>onSnapshot(Q(ref,cons),opts,next,err)});
const wrapDoc=d=>({id:d.id,set:o=>setDoc(d,o),update:p=>updateDoc(d,p),delete:()=>deleteDoc(d),collection:c=>wrapColl(collection(d,c))});

};
authFn.Auth={Persistence:{LOCAL:'local'}};

  firestore(){

      catch(e){db=initializeFirestore(app,{});window.__persist='fail:'+((e&&e.code)||'')}}
    return{collection:p=>wrapColl(collection(db,p)),

      terminate:()=>terminate(db),clearPersistence:()=>clearIndexedDbPersistence(db)};

};

const FEES={mada:0.008,visa:0.025};

function sumEntries(list){
  const r={in:0,out:0,cash:0,mada:0,visa:0};
  list.forEach(x=>{if(x.kind==='in'){r.in+=x.amount;r[x.method]=(r[x.method]||0)+x.amount}else r.out+=x.amount});
  r.madaFee=r.mada*FEES.mada;r.visaFee=r.visa*FEES.visa;r.fee=r.madaFee+r.visaFee;
  r.net=r.in-r.fee-r.out;
  return r;
}
function repTotals(repId,from,to){
  const tx=S.repTx.filter(x=>x.repId===repId);
  const inR=tx.filter(x=>inRange(x.date,from,to));
  const upTo=tx.filter(x=>x.date<=to);
  return{added:sum(inR.filter(x=>x.kind==='add'),x=>x.amount),paid:sum(inR.filter(x=>x.kind==='pay'),x=>x.amount),
    balance:sum(upTo,x=>x.kind==='add'?x.amount:-x.amount)};
}

function salaryFor(w,m){
  const h=(w.salaryHist&&w.salaryHist.length?w.salaryHist:[{from:(w.startMonth||'0000-00'),amount:w.salary||0}]).slice().sort((a,b)=>a.from.localeCompare(b.from));
  let v=null;h.forEach(x=>{if(x.from<=m)v=x.amount});return v||0;

   الرصيد = كل اللي استحقه من أول ما بدأ (رواتب + ثياب) − كل اللي دفعته له (دفعات وسلف) */
function wFirstMonth(w){const h=(w.salaryHist||[]).map(x=>x.from).filter(x=>x&&x>'0000-00').sort();return h[0]||w.startMonth||(w.createdAt?isoDate(new Date(w.createdAt)).slice(0,7):curMonth())}
const wStopped=w=>!!(w&&w.end);
function wSalaryOn(w,m){return (m>=wFirstMonth(w)&&(!w.end||m<=w.end))?salaryFor(w,m):0}
function workerBalance(w,upto){
  const m=upto.slice(0,7),fm=wFirstMonth(w);
  const sal=(W_SALARIED(w)&&fm<=m)?sum(monthsIn(fm+'-01',upto),mm=>wSalaryOn(w,mm)):0;
  const tx=S.workerTx.filter(x=>x.workerId===w.id&&x.date<=upto);
  const pcs=W_PIECES(w)?sum(tx.filter(x=>x.kind==='pieces'),x=>x.amount):0;
  const paid=sum(tx.filter(x=>x.kind==='exp'),x=>x.amount);

}

async function addEntity(col,label,withPrice){
  const r=await modal({title:`إضافة ${label}`,body:`<label class="field"><span>اسم ${label}</span><input type="text" name="name"></label>${withPrice?'<label class="field"><span>الراتب الشهري (ر.س)</span><input type="text" name="price" inputmode="decimal"></label>':''}`,
    actions:[{key:'ok',label:'إضافة'},{key:'cancel',label:'إلغاء',cls:'ghost'}]});
  if(!r)return;const name=r.values.name.trim();
  if(!name){toast('اكتب الاسم');return}
  const o={name};
  if(withPrice){const p=num(r.values.price);if(!(p>=0)){toast('اكتب الراتب الشهري');return}o.salary=p;o.startMonth=curMonth();o.salaryHist=[{from:curMonth(),amount:p}]}
  if(await safe(()=>store.add(col,o)))toast(`تمت إضافة ${name}`);
}
async function editName(col,id){
  const ent=S[col].find(x=>x.id===id);if(!ent)return;const c=ENT[col];
  const r=await modal({title:`تعديل اسم ${c.label}`,body:`<label class="field"><span>الاسم</span><input type="text" name="name" value="${esc(ent.name)}"></label>`,
    actions:[{key:'save',label:'حفظ الاسم'},{key:'cancel',label:'إلغاء',cls:'ghost'}]});
  if(!r)return;const n=r.values.name.trim();if(!n){toast('اكتب الاسم');return}
  if(n===ent.name)return;
  if(await safe(()=>store.update(col,id,{name:n})))toast('تم تعديل الاسم');
}
const ENT={branches:{label:'الفرع',child:'entries',fk:'branchId'},reps:{label:'المندوب',child:'repTx',fk:'repId'},workers:{label:'العامل',child:'workerTx',fk:'workerId'}};
const withDel=(html,col,id)=>`<div class="row-wrap">${html}<div class="row-btns"><button class="icon-btn edit-btn" data-act="editName" data-col="${col}" data-id="${id}" aria-label="تعديل الاسم">${svg('edit')}</button><button class="icon-btn del-btn" data-act="delEntity" data-col="${col}" data-id="${id}" aria-label="حذف">${svg('trash')}</button></div></div>`;
async function deleteEntity(col,id){
  const c=ENT[col],ent=S[col].find(x=>x.id===id);if(!ent)return;
  let kids=S[c.child].filter(x=>x[c.fk]===id);
  if(store.root&&WINDOWED.includes(c.child)){try{const sn=await store.root.collection(c.child).where(c.fk,'==',id).get();kids=sn.docs.map(d=>({...d.data(),id:d.id}))}catch(e){toast('تأكد من اتصال النت قبل الحذف');return}}
  const r=await modal({title:`حذف ${c.label} «${esc(ent.name)}»؟`,
    body:`<p>${kids.length?`بينحذف ${c.label} ومعه <b>${kids.length}</b> سجل تابع له نهائيًا.`:`بينحذف ${c.label} نهائيًا.`} تقدر تتراجع خلال ثواني بعد الحذف.</p><label class="field"><span>للتأكيد اكتب كلمة <b>حذف</b></span><input type="text" name="confirm" autocomplete="off" placeholder="حذف"></label>`,
    actions:[{key:'del',label:'حذف نهائي',cls:'danger'},{key:'cancel',label:'إلغاء',cls:'ghost'}]});
  if(!r)return;
  if(r.values.confirm.replace(/\s/g,'')!=='حذف'){toast('ما تم الحذف، لازم تكتب كلمة حذف');return}
  if(UI.detail&&UI.detail.id===id)go(UI.tab);
  if(await safe(async()=>{for(const k of kids)await store.remove(c.child,k.id);await store.remove(col,id)}))undoToast(`تم حذف ${ent.name}`,[{c:col,x:ent},...kids.map(k=>({c:c.child,x:k}))]);
}
async function delRow(col,id,title){const x=S[col].find(y=>y.id===id);
  if(await safe(()=>store.remove(col,id))&&x)undoToast('تم الحذف',[{c:col,x}])}

/* ---------- ملف PDF (للآيفون: الطباعة من داخل التطبيق ما تشتغل فيه) ---------- */
const IS_IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const usePDF=()=>IS_IOS||window.FORCE_PDF===true;
function loadScript(src){return new Promise((res,rej)=>{const ex=document.querySelector(`script[data-src="${src}"]`);if(ex){ex.dataset.ok?res():ex.addEventListener('load',res);return}
  const s=document.createElement('script');s.src=src;s.dataset.src=src;s.onload=()=>{s.dataset.ok=1;res()};s.onerror=()=>{s.remove();rej(new Error('load'))};document.head.appendChild(s)})}
async function buildReportPDF(){
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
  if(document.fonts&&document.fonts.ready)await document.fonts.ready;
  const pm=[...document.body.classList].filter(c=>c.startsWith('pm-'));
  const root=document.createElement('div');root.className=['pdf-mode',...pm].join(' ');root.dir='rtl';
  root.style.cssText='position:absolute;left:-20000px;top:0;width:760px;background:#fff';
  root.innerHTML=$('#view').innerHTML;root.querySelectorAll('[id]').forEach(e=>e.removeAttribute('id'));
  document.body.appendChild(root);
  try{
    const blocks=[],vis=el=>getComputedStyle(el).display!=='none';
    const walk=el=>{for(const c of el.children){if(!vis(c))continue;if(c.hasAttribute('data-sec')||c.classList.contains('print-only'))walk(c);else blocks.push(c)}};
    walk(root);
    const {jsPDF}=window.jspdf,pdf=new jsPDF({unit:'pt',format:'a4'});
    const PW=pdf.internal.pageSize.getWidth(),PH=pdf.internal.pageSize.getHeight(),M=28,CW=PW-2*M,BOT=PH-M;
    let y=M,pageUsed=false;
    const newPage=()=>{pdf.addPage();y=M;pageUsed=false};
    const shots=[];
    for(const el of blocks){const cv=await html2canvas(el,{scale:2,backgroundColor:'#ffffff',logging:false,useCORS:true});if(!cv.width||!cv.height)continue;
      const top=el.getBoundingClientRect().top,sc=cv.height/el.getBoundingClientRect().height;
      const cuts=[...el.querySelectorAll('tr')].map(tr=>Math.round((tr.getBoundingClientRect().bottom-top)*sc));   // نقص الجدول بين الصفوف مو وسطها
      shots.push({el,cv,h:cv.height*CW/cv.width,cuts})}
    for(let i=0;i<shots.length;i++){
      const {el,cv,h,cuts}=shots[i],k=CW/cv.width,gap=el.classList.contains('section-title')?4:10;
      if(el.classList.contains('pdf-newpage')&&pageUsed)newPage();
      if(el.classList.contains('section-title')&&pageUsed&&shots[i+1]){const nh=Math.min(shots[i+1].h,BOT-M-h-gap);if(y+h+gap+Math.max(nh,0)>BOT)newPage()}   // العنوان ما ينفصل عن اللي تحته
      const splitTable=cuts.length>3&&y+h>BOT&&BOT-y>160;   // جدول ما يكفيه الباقي من الصفحة: يكمل في الصفحة الجاية بدل ما يترك فراغ
      if(h<=BOT-M&&!splitTable){
        if(y+h>BOT)newPage();
        pdf.addImage(cv.toDataURL('image/jpeg',0.9),'JPEG',M,y,CW,h,undefined,'FAST');y+=h+gap;pageUsed=true;
      }else{                                                                      // جدول طويل: يتقسم على أكثر من صفحة
        let off=0;
        while(off<cv.height){
          if(BOT-y<120&&pageUsed)newPage();
          let sh=Math.min(Math.floor((BOT-y)/k),cv.height-off);
          if(off+sh<cv.height){const c=cuts.filter(v=>v>off+40&&v<=off+sh).pop();if(c)sh=c-off}
          const part=document.createElement('canvas');part.width=cv.width;part.height=sh;
          part.getContext('2d').drawImage(cv,0,off,cv.width,sh,0,0,cv.width,sh);
          pdf.addImage(part.toDataURL('image/jpeg',0.9),'JPEG',M,y,CW,sh*k,undefined,'FAST');
          off+=sh;y+=sh*k+gap;pageUsed=true;if(off<cv.height)newPage();
        }
      }
    }
    return pdf.output('blob');
  }finally{root.remove()}
}
async function sharePDF(name){
  toast('جارٍ تجهيز ملف PDF…');
  let blob;
  try{blob=await buildReportPDF()}catch(e){toast('ما قدرت أجهز الملف، تأكد من اتصال النت وحاول مرة ثانية');return}
  window.__lastPDF=blob;
  const file=new File([blob],name+'.pdf',{type:'application/pdf'}),url=URL.createObjectURL(blob);
  const canShare=!!(navigator.canShare&&navigator.canShare({files:[file]}));
  const p=modal({title:'ملف PDF جاهز',body:`<p>${canShare?'اضغط <b>مشاركة</b> واختر: حفظ في الملفات، أو طباعة، أو أرسله واتساب.':'اضغط <b>فتح الملف</b>، وبعدها تقدر تحفظه أو تطبعه.'}</p>`,
    actions:[...(canShare?[{key:'share',label:'مشاركة / حفظ / طباعة'}]:[]),{key:'open',label:'فتح الملف',cls:canShare?'ghost':''},{key:'cancel',label:'إغلاق',cls:'ghost'}]});
  // نربط الأزرار مباشرة عشان الآيفون يسمح بالمشاركة (لازم تكون من ضغطة المستخدم نفسها)
  const sb=document.querySelector('#modal-root [data-m=share]'),ob=document.querySelector('#modal-root [data-m=open]');
  if(sb)sb.addEventListener('click',()=>{navigator.share({files:[file],title:name}).catch(()=>{})});
  if(ob)ob.addEventListener('click',()=>{const w=window.open(url,'_blank');if(!w){const a=document.createElement('a');a.href=url;a.download=name+'.pdf';document.body.appendChild(a);a.click();a.remove()}});
  await p;setTimeout(()=>URL.revokeObjectURL(url),60000);
}

<script>
(function(){

  var kfmt=function(v){var a=Math.abs(v);return a>=1000?(v/1000).toLocaleString('en-US',{maximumFractionDigits:1})+'k':String(Math.round(v))};
  var niceStep=function(span){var raw=span/4,p=Math.pow(10,Math.floor(Math.log10(raw||1))),m=raw/p;return (m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10)*p};
  // نفس اليوم في الشهر اللي قبل (لو الشهر أقصر ياخذ آخر يوم فيه)
  var prevMonthDay=function(s){var d=parseD(s),day=d.getDate(),t=new Date(d.getFullYear(),d.getMonth()-1,1),last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();t.setDate(Math.min(day,last));return isoDate(t)};
  var days=function(a,b){var o=[];for(var d=a;d<=b;d=shiftDay(d,1))o.push(d);return o};
  var dayNet=function(list,d){var r=sumEntries(list.filter(function(x){return x.date===d}));return r.net};
  var grid=function(lo,hi,y){var st=niceStep(hi-lo),s='';for(var g=Math.ceil(lo/st)*st;g<=hi+1e-9;g+=st){s+='<line x1="'+P.l+'" x2="'+(W-P.r)+'" y1="'+y(g)+'" y2="'+y(g)+'" stroke="'+(g===0?'#D5D3E2':C.grid)+'"/><text x="'+(P.l-6)+'" y="'+(y(g)+3.5)+'" font-size="10" fill="'+C.muted+'" text-anchor="end">'+kfmt(g)+'</text>'}return s};
  var range=function(lo,hi){var st=niceStep(hi-lo);return[Math.floor(lo/st)*st,Math.ceil(hi/st)*st||st]};

  R.html=function(){
    return html0().replace('<h2 class="section-title">الملخص</h2>',
      '<h2 class="section-title">الرسومات</h2><section class="charts">'+
      '<div class="chart-card"><h3 id="ch1T">صافي كل يوم</h3><p class="note no-print">اضغط على أي عمود يطلع لك رقمه</p><div class="chart-box" id="ch1"></div>'+
      '<div class="chart-legend"><span><i style="background:'+C.bar+'"></i>صافي المحل</span><span><i class="ln" style="border-color:'+C.muted+';border-top-style:dashed"></i>المتوسط</span></div></div>'+
      '<div class="chart-card"><h3>مقارنة الدخل بالشهر الماضي</h3><p class="note" id="ch2N"></p><div class="chart-hero" id="ch2H"></div><div class="chart-box" id="ch2"></div><div class="chart-legend" id="ch2L"></div></div>'+
      '<div class="chart-card"><h3>طرق الدفع</h3><p class="note">من إجمالي دخل الفترة</p><div id="ch3"></div></div>'+
      '</section><h2 class="section-title">الملخص</h2>');
  };

  R.update=function(){
    upd0.apply(this,arguments);
    if(!document.getElementById('ch1'))return;
    var a=UI.rFrom,b=UI.rTo;if(a>b){var t=a;a=b;b=t}
    var pa=prevMonthDay(a),pb=prevMonthDay(b);

    var all=days(a,b),daily=all.length<=62;

    /* 1) صافي كل يوم (أو كل شهر لو الفترة طويلة) */

    if(daily)pts=all.map(function(d){return{label:String(parseD(d).getDate()),tip:fmtDay(d),v:dayNet(ents,d),has:ents.some(function(x){return x.date===d})}});
    else{var ms={};all.forEach(function(d){var m=d.slice(0,7);(ms[m]=ms[m]||[]).push(d)});
      pts=Object.keys(ms).sort().map(function(m){var l=ents.filter(function(x){return x.date.slice(0,7)===m});return{label:parseD(m+'-01').toLocaleDateString(LOC,{month:'short'}),tip:parseD(m+'-01').toLocaleDateString(LOC,{month:'long',year:'numeric'}),v:sumEntries(l).net,has:l.length>0}})}
    document.getElementById('ch1T').textContent=daily?'صافي كل يوم':'صافي كل شهر';

    else{
      var vals=pts.map(function(p){return p.v}),rg=range(Math.min(0,Math.min.apply(null,vals)),Math.max(0,Math.max.apply(null,vals)));
      var iw=W-P.l-P.r,ih=H-P.t-P.b,bw=iw/pts.length,y=function(v){return P.t+ih-(v-rg[0])/(rg[1]-rg[0])*ih},y0=y(0);
      var s='<svg viewBox="0 0 '+W+' '+H+'" direction="ltr" role="img" aria-label="صافي المحل">'+grid(rg[0],rg[1],y);
      var gap=bw>6?2:1;
      pts.forEach(function(p,i){if(!p.has||!p.v)return;var x=P.l+i*bw+gap/2,w=Math.max(bw-gap,1),top=Math.min(y(p.v),y0),h=Math.abs(y(p.v)-y0),r=Math.min(3,w/2,h);

      s+='<line x1="'+P.l+'" x2="'+(W-P.r)+'" y1="'+y(avg)+'" y2="'+y(avg)+'" stroke="'+C.muted+'" stroke-dasharray="4 3" stroke-width="1.2"/>';

      pts.forEach(function(p,i){s+='<rect class="hit" data-i="'+i+'" x="'+(P.l+i*bw)+'" y="'+P.t+'" width="'+bw+'" height="'+ih+'" fill="transparent"/>'});
      box1.innerHTML=s+'</svg>';
      var svg1=box1.querySelector('svg'),tip=null,selI=-1;
      box1.onclick=function(e){var h=e.target.closest&&e.target.closest('.hit');if(tip){tip.remove();tip=null}
        if(!h||+h.dataset.i===selI){selI=-1;return}selI=+h.dataset.i;var p=pts[selI];if(!p.has){selI=-1;return}
        var k=svg1.getBoundingClientRect().width/W;tip=document.createElement('div');tip.className='chart-tip';
        tip.innerHTML='<span>'+esc2(p.tip)+'</span><b>'+fmt(p.v)+' ر.س</b>';
        var tx=Math.min(Math.max((P.l+(selI+.5)*bw)*k,60),svg1.getBoundingClientRect().width-60);tip.style.left=tx+'px';tip.style.top=(Math.min(y(p.v),y0)*k-6)+'px';box1.appendChild(tip)};
    }

    /* 2) المتراكم مقارنة بالشهر اللي قبل، لين اليوم لو الفترة ما خلصت */
    var end=b<today()?b:today(),box2=document.getElementById('ch2'),hero=document.getElementById('ch2H'),leg=document.getElementById('ch2L'),note=document.getElementById('ch2N');

      var cs=cum(ents,cd),ps=cum(pents,pd),n=Math.max(cs.length,ps.length);
      var oneMonth=a.slice(0,7)===b.slice(0,7);

      var cl=cs[cs.length-1]||0,pl=ps[ps.length-1]||0,diff=cl-pl;

      else{var pc=pl?Math.round(diff/Math.abs(pl)*100):0;
        hero.innerHTML='<b dir="ltr">'+(diff>=0?'+':'−')+Math.abs(pc)+'%</b><span class="d '+(diff>=0?'up':'down')+'">'+(diff>=0?'▲ ':'▼ ')+fmt(Math.abs(diff))+' ر.س '+(diff>=0?'زيادة':'نقص')+'</span>'}

      var iw2=W-P.l-P.r,ih2=H-P.t-P.b,x=function(i){return P.l+(n>1?i/(n-1):.5)*iw2},y2=function(v){return P.t+ih2-(v-rg2[0])/(rg2[1]-rg2[0])*ih2};
      var path=function(arr){return arr.map(function(v,i){return(i?'L':'M')+x(i).toFixed(1)+','+y2(v).toFixed(1)}).join('')};
      var s2='<svg viewBox="0 0 '+W+' '+H+'" direction="ltr" role="img" aria-label="مقارنة الدخل بالشهر الماضي">'+grid(rg2[0],rg2[1],y2);
      if(pents.length&&!oldMissing)s2+='<path d="'+path(ps)+'" fill="none" stroke="'+C.prev+'" stroke-width="2" stroke-dasharray="5 4"/>';

      s2+='<text x="'+(x(li)+dxl)+'" y="'+(y2(cl)+(up?-9:16))+'" font-size="11" font-weight="700" fill="'+C.ink+'" text-anchor="'+anchor+'" stroke="#fff" stroke-width="4" paint-order="stroke">'+fmt(Math.round(cl))+'</text>';
      if(pents.length&&!oldMissing){var pi=ps.length-1;s2+='<text x="'+(x(pi)+(x(pi)>W/2?-8:8))+'" y="'+(y2(pl)+(up?16:-9))+'" font-size="10.5" fill="'+C.muted+'" text-anchor="'+(x(pi)>W/2?'end':'start')+'" stroke="#fff" stroke-width="4" paint-order="stroke">'+fmt(Math.round(pl))+'</text>'}
      var lab=[0,Math.round((n-1)/3),Math.round(2*(n-1)/3),n-1].filter(function(v,i,arr){return arr.indexOf(v)===i});
      lab.forEach(function(i){s2+='<text x="'+x(i)+'" y="'+(H-6)+'" font-size="10" fill="'+C.muted+'" text-anchor="middle">'+parseD(shiftDay(a,i)).getDate()+'</text>'});
      box2.innerHTML=s2+'</svg>';
      leg.innerHTML='<span><i class="ln" style="border-color:'+C.cur+'"></i>'+esc2(curL)+'</span><span><i class="ln" style="border-color:'+C.prev+';border-top-style:dashed"></i>'+esc2(prvL)+'</span>';

    /* 3) طرق الدفع */
    var T=sumEntries(ents),box3=document.getElementById('ch3');

<script>
(function(){
  if(typeof VIEWS==='undefined'||!VIEWS.branches)return;
  var XLSX_URL='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';

  var cellText=function(c){return c&&c.c&&c.c.length?c.c.map(function(x){return String(x.t||'').trim()}).filter(Boolean).join(' / ').replace(/\s*\n+\s*/g,' / '):''};
  var dateCode=function(c){if(!c)return null;if(c.t==='n'&&c.v>20000&&c.v<80000){var d=XLSX.SSF.parse_date_code(c.v);return d&&{y:d.y,m:d.m,d:d.d}}
    if(c.t==='d'&&c.v instanceof Date)return{y:c.v.getFullYear(),m:c.v.getMonth()+1,d:c.v.getDate()};return null};
  var amount=function(c){if(!c)return 0;var v=c.v;if(typeof v==='string')v=num(v);return typeof v==='number'&&isFinite(v)?Math.round(v*100)/100:0};

  /* يقرأ ورقة شهر: يلقى صف العناوين، ويطلع صف لكل يوم */

    if(!ws||!ws['!ref'])return null;var R=XLSX.utils.decode_range(ws['!ref']),get=function(r,c){return ws[XLSX.utils.encode_cell({r:r,c:c})]};
    var hr=-1,col={};
    for(var r=R.s.r;r<=Math.min(R.e.r,R.s.r+10)&&hr<0;r++){for(var c=R.s.c;c<=R.e.c;c++){var t=norm(get(r,c)&&get(r,c).v);
      Object.keys(COLS_MAP).forEach(function(k){if(col[k]==null&&COLS_MAP[k].some(function(w){return t===norm(w)}))col[k]=c})}
      if(col.date!=null&&(col.mada!=null||col.cash!=null||col.visa!=null))hr=r;else col={}}
    if(hr<0)return null;

    var ym=null;for(var r0=R.s.r;r0<hr&&!ym;r0++)for(var c0=R.s.c;c0<=R.e.c&&!ym;c0++){var dc=dateCode(get(r0,c0));if(dc)ym={y:dc.y,m:dc.m}}
    var rows=[],r2;
    for(r2=hr+1;r2<=R.e.r;r2++){var dc2=dateCode(get(r2,col.date));if(!dc2)break;rows.push({r:r2,dc:dc2})}
    if(!rows.length)return null;
    if(!ym){var mn=(name.match(/\((\d{1,2})\)/)||[])[1],cnt={};rows.forEach(function(x){var k=x.dc.y+'-'+x.dc.m;cnt[k]=(cnt[k]||0)+1});
      var top=Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a]})[0].split('-');ym={y:+top[0],m:mn?+mn:+top[1]}}
    var last=new Date(ym.y,ym.m,0).getDate(),days=[];
    rows.forEach(function(x){if(x.dc.d>last)return;var date=ym.y+'-'+p2(ym.m)+'-'+p2(x.dc.d),items=[],rowNote=col.note!=null?String((get(x.r,col.note)||{}).v||'').trim():'';
      [['mada','mada'],['visa','visa'],['cash','cash']].forEach(function(k){if(col[k[0]]==null)return;var c=get(x.r,col[k[0]]),a=amount(c);if(a>0){var o={branchId:BID,kind:'in',amount:a,method:k[1],date:date,src:'xlsx'},n=cellText(c);if(n)o.note=n;items.push(o)}});
      if(col.out!=null){var ce=get(x.r,col.out),ae=amount(ce);if(ae>0)items.push({branchId:BID,kind:'out',amount:ae,note:cellText(ce)||rowNote||'',date:date,src:'xlsx'})}
      if(items.length)days.push({date:date,items:items})});
    return{name:name,ym:ym,key:ym.y+'-'+p2(ym.m),days:days};
  }
  var monthName=function(key){return parseD(key+'-01').toLocaleDateString(LOC,{month:'long',year:'numeric'})};

  function pickFile(){return new Promise(function(res){var i=document.createElement('input');i.type='file';
    i.accept='.xlsx,.xls,.xlsm,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,image/*';
    i.onchange=function(){res(i.files&&i.files[0]||null)};i.click()})}

  /* ===== قراءة صورة جدول (نفس ترتيب ملف Excel: التاريخ، مدى، فيزا، كاش، مصروفات، سحبيات، المتبقي) ===== */
  var TESS_URL='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
  function loadImg(f){return new Promise(function(res,rej){var u=URL.createObjectURL(f),im=new Image();im.onload=function(){res(im)};im.onerror=rej;im.src=u})}
  function lineGroups(prof,min){var out=[],s=-1;for(var i=0;i<=prof.length;i++){var on=i<prof.length&&prof[i]>=min;if(on&&s<0)s=i;if(!on&&s>=0){out.push(Math.round((s+i-1)/2));s=-1}}return out}
  function otsu(px){var h=new Array(256).fill(0);for(var i=0;i<px.length;i++)h[px[i]]++;var tot=px.length,sum=0;for(var t=0;t<256;t++)sum+=t*h[t];
    var sB=0,wB=0,best=0,th=128;for(t=0;t<256;t++){wB+=h[t];if(!wB)continue;var wF=tot-wB;if(!wF)break;sB+=t*h[t];var mB=sB/wB,mF=(sum-sB)/wF,v=wB*wF*(mB-mF)*(mB-mF);if(v>best){best=v;th=t}}return th}
  async function imageMonths(f){
    var im;try{im=await loadImg(f)}catch(e){toast('ما قدرت أفتح الصورة');return null}
    var sc=Math.min(1,2600/Math.max(im.naturalWidth,im.naturalHeight)),W=Math.round(im.naturalWidth*sc),H=Math.round(im.naturalHeight*sc);
    var cv=document.createElement('canvas');cv.width=W;cv.height=H;var cx=cv.getContext('2d',{willReadFrequently:true});cx.fillStyle='#fff';cx.fillRect(0,0,W,H);cx.drawImage(im,0,0,W,H);
    var d=cx.getImageData(0,0,W,H).data,g=new Uint8Array(W*H);for(var i=0;i<W*H;i++)g[i]=(d[i*4]*299+d[i*4+1]*587+d[i*4+2]*114)/1000;
    // خطوط الجدول: أطول خط غامق متصل في كل عمود وكل صف
    var DK=120,vr=new Array(W).fill(0),hr=new Array(H).fill(0),run;
    for(var x=0;x<W;x++){run=0;for(var y=0;y<H;y++){if(g[y*W+x]<DK){run++;if(run>vr[x])vr[x]=run}else run=0}}
    for(y=0;y<H;y++){run=0;for(x=0;x<W;x++){if(g[y*W+x]<DK){run++;if(run>hr[y])hr[y]=run}else run=0}}
    var V=lineGroups(vr,H*.35),Hh=lineGroups(hr,W*.35);
    if(V.length<5||Hh.length<6){toast('ما قدرت ألقى خطوط الجدول في الصورة. صوّر الجدول كامل وواضح');return null}
    toast('جارٍ تجهيز قارئ الصور…');
    try{await loadScript(TESS_URL)}catch(e){toast('قارئ الصور يحتاج نت أول مرة');return null}
    var worker;try{worker=await Tesseract.createWorker('eng');await worker.setParameters({tessedit_pageseg_mode:'7',tessedit_char_whitelist:'0123456789/.,-'})}
    catch(e){toast('ما قدرت أشغّل قارئ الصور، تأكد من النت');return null}
    var nc=V.length-1,nr=Hh.length-1,cells=[],done=0,todo=[];
    for(var r=0;r<nr;r++){cells.push([]);for(var c=0;c<nc;c++){var x0=V[c]+3,x1=V[c+1]-2,y0=Hh[r]+3,y1=Hh[r+1]-2,ink=0;
      if(x1-x0<6||y1-y0<6){cells[r].push(null);continue}
      for(y=y0;y<y1;y++)for(x=x0;x<x1;x++)if(g[y*W+x]<140)ink++;
      cells[r].push(ink>=6?{x0:x0,x1:x1,y0:y0,y1:y1}:null);if(ink>=6)todo.push([r,c])}}
    var prog=function(){var t=$('#toast');t.classList.remove('undo');t.textContent='جارٍ قراءة الصورة… '+Math.round(done/todo.length*100)+'%';t.classList.add('show');clearTimeout(toastT)};
    prog();
    var cc=document.createElement('canvas'),k=3;
    var ocrBox=async function(b){var w=b.x1-b.x0,h=b.y1-b.y0,pad=15;
      cc.width=w*k+pad*2;cc.height=h*k+pad*2;var q=cc.getContext('2d',{willReadFrequently:true});q.fillStyle='#fff';q.fillRect(0,0,cc.width,cc.height);
      q.imageSmoothingQuality='high';q.drawImage(cv,b.x0,b.y0,w,h,pad,pad,w*k,h*k);
      var id=q.getImageData(0,0,cc.width,cc.height),gg=new Uint8Array(cc.width*cc.height);for(var i=0;i<gg.length;i++)gg[i]=(id.data[i*4]*299+id.data[i*4+1]*587+id.data[i*4+2]*114)/1000;
      var th=otsu(gg);for(i=0;i<gg.length;i++){var v=gg[i]>th?255:0;id.data[i*4]=id.data[i*4+1]=id.data[i*4+2]=v}q.putImageData(id,0,0);
      try{var res=await worker.recognize(cc);b.text=String(res.data.text||'').trim();b.conf=res.data.confidence}catch(e){b.text='';b.conf=0}};
    for(var n=0;n<todo.length;n++){var rc=todo[n],b=cells[rc[0]][rc[1]];await ocrBox(b);done++;if(n%4===0)prog()}
    $('#toast').classList.remove('show');
    // عمود التاريخ: أكثر عمود فيه تواريخ
    var isDate=function(s){return /^\d{1,2}\s*[\/\-.]\s*\d{1,2}/.test(s||'')};
    var dcol=-1,best=0;for(c=0;c<nc;c++){var cnt=0;for(r=0;r<nr;r++)if(cells[r][c]&&isDate(cells[r][c].text))cnt++;if(cnt>best){best=cnt;dcol=c}}
    if(best<1||(dcol!==0&&dcol!==nc-1)){toast('ما لقيت عمود التاريخ في طرف الجدول');return null}
    var dir=dcol===0?1:-1,colOf=function(i){return dcol+dir*i};   // 1 مدى، 2 فيزا، 3 كاش، 4 مصروفات
    var numOf=function(cell){if(!cell||!cell.text)return'';var t=cell.text.replace(/,/g,'');var m=t.match(/\d+(\.\d+)?/);return m?m[0]:''};
    // الشهر والسنة: الأكثر تكرار
    var cntM={},rows=[];
    for(r=0;r<nr;r++){var dc=cells[r][dcol];if(!dc||!isDate(dc.text))continue;var p=dc.text.match(/\d+/g)||[];rows.push(r);
      var mm=+p[1],yy=p[2]?+p[2]:0;if(mm>12&&String(p[1]).length>2)mm=+String(p[1]).slice(0,1);if(yy>0&&yy<100)yy+=2000;var key=(yy||new Date().getFullYear())+'-'+p2(mm);if(mm>=1&&mm<=12)cntM[key]=(cntM[key]||0)+1}
    var key0=Object.keys(cntM).sort(function(a,b){return cntM[b]-cntM[a]})[0];if(!key0){toast('ما قدرت أقرأ التواريخ');return null}
    var lastDay=new Date(+key0.slice(0,4),+key0.slice(5),0).getDate(),prev=0;
    var data=rows.map(function(r){var p=(cells[r][dcol].text.match(/\d+/g)||[]),day=+p[0];if(!(day>=1&&day<=lastDay)||day<=prev)day=prev+1;prev=day;
      var o={day:day,low:{}};['','mada','visa','cash','out'].forEach(function(k,i){if(!i)return;var cl=cells[r][colOf(i)];o[k]=numOf(cl);if(cl&&cl.text&&cl.conf<75)o.low[k]=1});return o});
    // صف المجموع: أول صف بعد آخر تاريخ فيه أرقام
    var tot=null,lastR=rows[rows.length-1],tr=-1;for(r=lastR+1;r<nr&&!tot;r++){var a=numOf(cells[r][colOf(1)]),bb=numOf(cells[r][colOf(2)]);if(a||bb){tr=r;tot={mada:a,visa:bb,cash:numOf(cells[r][colOf(3)]),out:numOf(cells[r][colOf(4)])}}}
    if(tot){var KS=['','mada','visa','cash','out'];for(var i2=1;i2<=4;i2++){var kk=KS[i2],sm=String(Math.round(data.reduce(function(t,o){return t+(+o[kk]||0)},0)));
      if((tot[kk]||'').split('.')[0].length<sm.length-1&&tr+1<nr){var cA=colOf(i2),bx={x0:V[cA]+3,x1:V[cA+1]-2,y0:Hh[tr]+3,y1:Hh[tr+2]-2};await ocrBox(bx);tot[kk]=numOf(bx)}}}   // خلية مدموجة على صفين
    try{await worker.terminate()}catch(e){}
    return await reviewImage(key0,data,tot);
  }
  async function reviewImage(key,data,tot){
    var sumOf=function(k){return data.reduce(function(t,o){return t+(+o[k]||0)},0)};
    var chk=function(k,lab){if(!tot||!tot[k])return '';var ok=Math.abs(sumOf(k)-(+tot[k]))<0.01;
      return '<span class="'+(ok?'ok':'bad')+'">'+lab+' '+(ok?'✓ يطابق المجموع':'⚠ مجموعها '+fmt(sumOf(k))+' والصورة '+fmt(+tot[k]))+'</span>'};
    var body='<p>قريت '+data.length+' يوم من '+esc(monthName(key))+'. راجع الأرقام وصحح أي غلط قبل الاستيراد. الخانات الصفراء غير متأكد منها.</p>'+
      (tot?'<div class="ocr-chk">'+chk('mada','مدى')+chk('visa','فيزا')+chk('cash','كاش')+chk('out','مصروفات')+'</div>':'')+
      '<div class="ocr-wrap"><table class="ocr-tbl"><thead><tr><th>اليوم</th><th>مدى</th><th>فيزا</th><th>كاش</th><th>مصروف</th></tr></thead><tbody>'+
      data.map(function(o,i){return '<tr><td>'+o.day+'</td>'+['mada','visa','cash','out'].map(function(k){return '<td><input name="r'+i+'_'+k+'" value="'+o[k]+'" size="4" inputmode="decimal" dir="ltr"'+(o.low[k]?' class="low"':'')+'></td>'}).join('')+'</tr>'}).join('')+
      '</tbody></table></div><p style="font-size:.8rem;color:var(--muted);margin:8px 0 0">السحبيات والرواتب ما تنستورد، والصورة ما فيها ملاحظات الخلايا.</p>';
    setTimeout(function(){var a=document.activeElement;if(a&&a.closest&&a.closest('.ocr-tbl'))a.blur()},30);
    var r=await modal({title:'مراجعة الأرقام من الصورة',body:body,actions:[{key:'ok',label:'التالي'},{key:'cancel',label:'إلغاء',cls:'ghost'}]});
    if(!r)return null;
    var days=[];data.forEach(function(o,i){var date=key+'-'+p2(o.day),items=[];
      [['mada','mada'],['visa','visa'],['cash','cash']].forEach(function(k){var a=num(r.values['r'+i+'_'+k[0]]);if(a>0)items.push({branchId:BID,kind:'in',amount:Math.round(a*100)/100,method:k[1],date:date,src:'img'})});
      var e=num(r.values['r'+i+'_out']);if(e>0)items.push({branchId:BID,kind:'out',amount:Math.round(e*100)/100,note:'',date:date,src:'img'});
      if(items.length)days.push({date:date,items:items})});
    return[{key:key,days:days}];
  }
  async function runImport(){
    var f=await pickFile();if(!f)return;
    if(/^image\//.test(f.type)||/\.(png|jpe?g|heic|heif|webp)$/i.test(f.name)){var im=await imageMonths(f);if(im&&im[0].days.length)await commitMonths(im);else if(im)toast('ما فيه أرقام للاستيراد');return}
    toast('جارٍ قراءة الملف…');
    var months;
    try{await loadScript(XLSX_URL);
      var wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:false,cellComments:true});
      months=wb.SheetNames.map(function(n){return readSheet(n,wb.Sheets[n])}).filter(function(m){return m&&m.days.length});
    }catch(e){toast('ما قدرت أقرأ الملف، تأكد إنه ملف Excel وإن النت شغال أول مرة');return}
    if(!months.length){toast('ما لقيت في الملف أعمدة التاريخ ومدى وفيزا وكاش');return}
    await commitMonths(months);
  }
  async function commitMonths(months){
    $('#toast').classList.remove('show');
    // الشهر
    var sel=months;
    if(months.length>1){
      var opts='<div class="xl-list">'+(months.length>1?'<label><span>كل الأشهر <small>('+months.length+' أشهر)</small></span><input type="radio" name="m" value="all"></label>':'')+
        months.slice().reverse().map(function(m,i){return '<label><span>'+esc(monthName(m.key))+' <small>('+m.days.length+' يوم فيه أرقام)</small></span><input type="radio" name="m" value="'+m.key+'"'+(i===0?' checked':'')+'></label>'}).join('')+'</div>';
      var r=await modal({title:'أي شهر تبي تستورد؟',body:'<p>لقيت هذي الأشهر في الملف:</p>'+opts,actions:[{key:'ok',label:'التالي'},{key:'cancel',label:'إلغاء',cls:'ghost'}]});
      if(!r)return;sel=r.values.m==='all'?months:months.filter(function(m){return m.key===r.values.m});if(!sel.length)return}
    // نجيب بيانات الأشهر من القاعدة عشان نعرف الأيام المسجلة من قبل
    var keys=sel.map(function(m){return m.key}).sort();
    if(typeof ensureRange==='function'){try{await ensureRange(keys[0]+'-01',monthBounds(keys[keys.length-1])[1])}catch(e){}}
    if(store.root&&typeof LOADED!=='undefined'&&keys.some(function(k){return k<CUTOFF_M&&LOADED[k]!==true})){toast('ما قدرت أتأكد من البيانات القديمة، تأكد من النت وحاول مرة ثانية');return}
    var have={};S.entries.forEach(function(x){have[x.date]=1});
    var add=[],skipped=[];
    sel.forEach(function(m){m.days.forEach(function(d){if(have[d.date])skipped.push(d.date);else add=add.concat(d.items)})});
    if(!add.length){await modal({title:'ما فيه شي جديد',body:'<p>كل الأيام اللي في الملف مسجلة في التطبيق من قبل ('+skipped.length+' يوم).</p>',actions:[{key:'ok',label:'تمام'}]});return}
    var t={mada:0,visa:0,cash:0,out:0},notes=[];
    add.forEach(function(x){if(x.kind==='in')t[x.method]+=x.amount;else t.out+=x.amount;if(x.note)notes.push((x.kind==='out'?'مصروف ':ML[x.method]+' ')+fmt(x.amount)+': '+esc(x.note)+' <small>('+fmtShort(x.date)+')</small>')});
    var dcount=new Set(add.map(function(x){return x.date})).size;
    var body='<p>'+esc(sel.length>1?sel.length+' أشهر':monthName(sel[0].key))+': <b>'+dcount+'</b> يوم، <b>'+add.length+'</b> حركة.</p>'+
      (skipped.length?'<p class="xl-warn">بتخطى '+skipped.length+' يوم لأنها مسجلة في التطبيق من قبل.</p>':'')+
      '<div class="xl-sum"><span>مدى</span><b>'+fmt(t.mada)+'</b><span>فيزا</span><b>'+fmt(t.visa)+'</b><span>كاش</span><b>'+fmt(t.cash)+'</b><span>المصروفات</span><b>'+fmt(t.out)+'</b></div>'+
      (notes.length?'<p style="margin:0 0 4px"><b>'+notes.length+'</b> ملاحظة انقرت من الملف:</p><ul class="xl-notes">'+notes.map(function(n){return '<li>'+n+'</li>'}).join('')+'</ul>':'')+
      '<p style="font-size:.8rem;color:var(--muted);margin:10px 0 0">عمود السحبيات والرواتب ما ينستورد.</p>';
    var ok=await modal({title:'تأكيد الاستيراد',body:body,actions:[{key:'ok',label:'استيراد '+add.length+' حركة'},{key:'cancel',label:'إلغاء',cls:'ghost'}]});
    if(!ok)return;
    var ids=[];
    var done=await safe(async function(){for(var i=0;i<add.length;i++){var id=await store.add('entries',add[i]);if(id)ids.push(id)}});
    if(!done&&!ids.length)return;
    var tt=$('#toast');clearTimeout(toastT);
    tt.innerHTML='<span>انستوردت '+ids.length+' حركة</span><button type="button" class="undo-btn">تراجع</button>';tt.classList.add('undo','show');
    var used=false;tt.querySelector('.undo-btn').onclick=async function(){if(used)return;used=true;tt.classList.remove('show','undo');
      if(await safe(async function(){for(var i=0;i<ids.length;i++)await store.remove('entries',ids[i])}))toast('تم التراجع عن الاستيراد')};
    toastT=setTimeout(function(){tt.classList.remove('show','undo')},10000);
  }
  ACT.xlImport=function(){runImport()};
  if(typeof UI!=='undefined'&&UI.tab==='branches'&&!UI.detail&&typeof mount==='function')mount();
})();
</script>

<script>
(function(){
  if(typeof VIEWS==='undefined')return;

  var Wd=360,Hd=190,P={l:36,r:8,t:22,b:24};
  var kf=function(v){var a=Math.abs(v);return a>=1000?(v/1000).toLocaleString('en-US',{maximumFractionDigits:a>=100000?0:1})+'k':String(Math.round(v))};
  var step=function(span){var raw=span/4,p=Math.pow(10,Math.floor(Math.log10(raw||1))),m=raw/p;return(m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10)*p};
  var yearOf=function(){return UI.year||+today().slice(0,4)};
  var monthsOfYear=function(y){var o=[];for(var i=1;i<=12;i++)o.push(y+'-'+(i<10?'0':'')+i);return o};
  var missing=function(y){if(!store.root||typeof LOADED==='undefined'||typeof CUTOFF_M==='undefined')return false;
    return monthsOfYear(y).some(function(m){return m<CUTOFF_M&&m<=curMonth()&&LOADED[m]!==true})};
  function rowFor(m){var b=monthBounds(m),a=b[0],e=b[1];if(m>curMonth())return{m:m,future:true};
    var T=sumEntries(S.entries.filter(function(x){return inRange(x.date,a,e)}));
    var wages=0;S.workers.forEach(function(w){wages+=workerTotals(w.id,a,e).salary});
    var rep=0;S.reps.forEach(function(r){rep+=repTotals(r.id,a,e).paid});
    return{m:m,T:T,wages:wages,rep:rep,shop:T.in-T.fee-T.out,fin:T.in-T.fee-T.out-wages-rep}}

  VIEWS.year={
    html:function(){return '<div class="detail-top no-print"><button class="back" data-act="back">'+svg('prev')+'التقرير الشهري</button></div>'+
      '<div class="print-head"><div><strong>Dithar</strong><span>التقرير السنوي</span></div><div id="yPeriod"></div></div>'+
      '<div class="page-head"><div><h1>التقرير السنوي</h1><p class="sub" id="ySub"></p></div><button class="btn no-print" data-act="printYear">طباعة / حفظ PDF</button></div>'+
      '<div class="yr-bar no-print"><button class="icon-btn" data-act="yearShift" data-n="-1" aria-label="السنة السابقة">'+svg('prev')+'</button><strong id="yLabel"></strong><button class="icon-btn" data-act="yearShift" data-n="1" aria-label="السنة التالية">'+svg('next')+'</button></div>'+
      '<div class="yr-stats" id="yStats"></div>'+
      '<h2 class="section-title">مقارنة الأشهر</h2><section class="charts"><div class="chart-card"><h3>الدخل لكل شهر</h3><p class="note">كاش + مدى + فيزا، بدون خصم المصروفات</p><div class="chart-box" id="yChart"></div>'+
      '<div class="chart-legend"><span><i style="background:'+C.bar+'"></i>دخل الشهر</span><span><i class="ln" style="border-color:'+C.muted+';border-top-style:dashed"></i>متوسط الأشهر</span></div></div></section>'+
      '<h2 class="section-title pdf-newpage">تفاصيل كل شهر</h2><section class="panel"><div class="tbl-wrap" id="yTable">'+loading+'</div></section>'},
    update:function(){
      var y=yearOf();$('#yLabel').textContent=y;$('#ySub').textContent='يناير – ديسمبر '+y;
      var pp=$('#yPeriod');if(pp)pp.innerHTML='<span>السنة: '+y+'</span><span>تاريخ الطباعة: '+fmtDay(today())+'</span>';
      if(missing(y)){$('#yTable').innerHTML='<p class="empty">جارٍ جلب بيانات الأشهر القديمة…</p>';$('#yChart').innerHTML='';$('#yStats').innerHTML='';return}
      var rows=monthsOfYear(y).map(rowFor),hasIn=rows.filter(function(r){return !r.future&&r.T.in>0}),full=hasIn.filter(function(r){return r.m<curMonth()}),done=full.length?full:hasIn;   // الشهر الحالي ما يدخل في المتوسط وأعلى/أقل شهر لأنه ما خلص
      var sumK=function(f){return rows.reduce(function(t,r){return t+(r.future?0:f(r))},0)};
      var tin=sumK(function(r){return r.T.in}),avg=done.length?tin/done.length:0;
      var best=done.slice().sort(function(a,b){return b.T.in-a.T.in})[0],worst=done.slice().sort(function(a,b){return a.T.in-b.T.in})[0];
      var mname=function(m){return parseD(m+'-01').toLocaleDateString(LOC,{month:'long'})};
      $('#yStats').innerHTML='<div><span>دخل السنة</span><b>'+fmt(tin)+'</b> <small>ر.س</small></div><div><span>متوسط الشهر</span><b>'+fmt(Math.round(avg))+'</b> <small>ر.س</small></div>'+
        '<div><span>أعلى شهر</span><b>'+(best?mname(best.m):'—')+'</b>'+(best?' <small>'+fmt(best.T.in)+'</small>':'')+'</div><div><span>أقل شهر</span><b>'+(worst?mname(worst.m):'—')+'</b>'+(worst?' <small>'+fmt(worst.T.in)+'</small>':'')+'</div>';
      // الرسم: عمود لكل شهر مع الرقم فوقه
      var box=$('#yChart');
      if(!hasIn.length)box.innerHTML='<p class="chart-empty">ما فيه دخل مسجل في '+y+'.</p>';
      else{var mx=Math.max.apply(null,hasIn.map(function(r){return r.T.in})),st=step(mx),top=Math.ceil(mx*1.12/st)*st,iw=Wd-P.l-P.r,ih=Hd-P.t-P.b,bw=iw/12;
        var yy=function(v){return P.t+ih-v/top*ih},s='<svg viewBox="0 0 '+Wd+' '+Hd+'" direction="ltr" role="img" aria-label="الدخل لكل شهر">';
        for(var g=0;g<=top+1e-9;g+=st)s+='<line x1="'+P.l+'" x2="'+(Wd-P.r)+'" y1="'+yy(g)+'" y2="'+yy(g)+'" stroke="'+(g===0?'#D5D3E2':C.grid)+'"/><text x="'+(P.l-6)+'" y="'+(yy(g)+3.5)+'" font-size="10" fill="'+C.muted+'" text-anchor="end">'+kf(g)+'</text>';
        rows.forEach(function(r,i){var x=P.l+i*bw+2,w=bw-4,cx=x+w/2;
          s+='<text x="'+cx+'" y="'+(Hd-7)+'" font-size="9.5" fill="'+C.muted+'" text-anchor="middle">'+(i+1)+'</text>';
          if(r.future||!r.T.in)return;var t0=yy(r.T.in),h=P.t+ih-t0,rr=Math.min(3,w/2,h);
          s+='<path d="M'+x+','+(P.t+ih)+'V'+(t0+rr)+'q0,-'+rr+' '+rr+',-'+rr+'h'+(w-2*rr)+'q'+rr+',0 '+rr+','+rr+'V'+(P.t+ih)+'z" fill="'+(r.m===curMonth()?C.barSoft:C.bar)+'"/>';
          s+='<text x="'+cx+'" y="'+(t0-4)+'" font-size="9" font-weight="'+(r===best?'700':'500')+'" fill="'+C.ink+'" text-anchor="middle">'+kf(r.T.in)+'</text>'});
        s+='<line x1="'+P.l+'" x2="'+(Wd-P.r)+'" y1="'+yy(avg)+'" y2="'+yy(avg)+'" stroke="'+C.muted+'" stroke-dasharray="4 3" stroke-width="1.2"/>';
        box.innerHTML=s+'</svg>'+(rows.some(function(r){return r.m===curMonth()})?'<p class="note" style="margin:6px 0 0">العمود الفاتح هو الشهر الحالي، وما خلص للحين.</p>':'')}
      // الجدول
      var c=function(v,k){return '<td class="num '+(k||'')+'">'+fmt(v)+'</td>'};
      $('#yTable').innerHTML='<table class="yr-tbl"><thead><tr><th>الشهر</th><th class="num">كاش</th><th class="num">مدى</th><th class="num">فيزا</th><th class="num">الدخل</th><th class="num">العمولة</th><th class="num">المصروفات</th><th class="num">صافي المحل</th><th class="num">رواتب العمال</th><th class="num">المناديب</th><th class="num">الصافي النهائي</th></tr></thead><tbody>'+
        rows.map(function(r){if(r.future)return '<tr class="future"><td>'+mname(r.m)+'</td><td colspan="10" class="num">—</td></tr>';
          return '<tr><td>'+mname(r.m)+'</td>'+c(r.T.cash)+c(r.T.mada)+c(r.T.visa)+c(r.T.in,'pos')+c(r.T.fee,'neg')+c(r.T.out,'neg')+c(r.shop)+c(r.wages,'neg')+c(r.rep,'neg')+'<td class="num cur">'+fmt(r.fin)+'</td></tr>'}).join('')+
        '</tbody><tfoot><tr><td>الإجمالي</td>'+c(sumK(function(r){return r.T.cash}))+c(sumK(function(r){return r.T.mada}))+c(sumK(function(r){return r.T.visa}))+c(tin,'pos')+c(sumK(function(r){return r.T.fee}),'neg')+c(sumK(function(r){return r.T.out}),'neg')+c(sumK(function(r){return r.shop}))+c(sumK(function(r){return r.wages}),'neg')+c(sumK(function(r){return r.rep}),'neg')+'<td class="num cur">'+fmt(sumK(function(r){return r.fin}))+'</td></tr></tfoot></table>';
    }
  };
  var doPrintYear=function(){if(missing(yearOf())){toast('استنى لين تكتمل بيانات السنة');return}refresh();if(usePDF()){sharePDF('Dithar-'+yearOf());return}setTimeout(function(){window.print()},50)};
  ACT.yearShift=function(t){UI.year=yearOf()+(+t.dataset.n);refresh()};
  ACT.printYear=doPrintYear;
  ACT.openYear=function(){UI.year=+UI.rFrom.slice(0,4)||yearOf();go('report',{type:'year'})};
  var monthly=ACT.printReport;
  ACT.printReport=async function(){
    var r=await modal({title:'وش تبي تطبع؟',body:'<p>التقرير الشهري للفترة اللي اخترتها، أو التقرير السنوي كامل مع مقارنة الأشهر بالرسم.</p>',
      actions:[{key:'month',label:'التقرير الشهري'},{key:'year',label:'التقرير السنوي '+(+UI.rFrom.slice(0,4)||yearOf())},{key:'cancel',label:'إلغاء',cls:'ghost'}]});
    if(!r)return;if(r.key==='month'){monthly();return}
    UI.year=+UI.rFrom.slice(0,4)||yearOf();go('report',{type:'year'});
    var tries=0;(function wait(){if(missing(UI.year)&&tries++<60){setTimeout(wait,500);return}setTimeout(doPrintYear,300)})();
  };
})();
</script>
<!-- ===== نهاية التقرير السنوي ===== -->
</body>
</html>
