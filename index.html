<style>
:root{
  --bg:#F1F1F6;--surface:#FFFFFF;--surface-2:#F6F6FA;--ink:#1D1B36;--muted:#6A6884;--line:#E1E0EC;
  --brass:#A77826;--brass-soft:#F5EBD7;--pos:#2B7A57;--pos-soft:#E3F2EA;--neg:#B5443A;--neg-soft:#F8E6E3;--focus:#5B4FD6;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131229;--surface:#1C1A37;--surface-2:#242247;--ink:#ECEAF8;--muted:#A3A1C4;--line:#302E57;
    --brass:#DDB264;--brass-soft:#3A3122;--pos:#62C79A;--pos-soft:#1C3A2E;--neg:#F08A7E;--neg-soft:#41232A;--focus:#A49CFF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131229;--surface:#1C1A37;--surface-2:#242247;--ink:#ECEAF8;--muted:#A3A1C4;--line:#302E57;
  --brass:#DDB264;--brass-soft:#3A3122;--pos:#62C79A;--pos-soft:#1C3A2E;--neg:#F08A7E;--neg-soft:#41232A;--focus:#A49CFF;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;background:#F1F1F6!important;color-scheme:light only}
html,body{min-height:100%}
body{margin:0;min-height:100vh;min-height:100dvh;background:#F1F1F6!important;color:var(--ink);font-family:"Readex Pro","IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;font-size:16px;line-height:1.55;font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:600}
small{font-size:.72em;color:var(--muted);font-weight:400}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar-in{max-width:960px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:1.05rem}
.brand-mark{width:32px;height:32px;border-radius:10px;background:var(--ink);color:var(--bg);display:grid;place-items:center}
.brand-mark svg{width:18px;height:18px}
.brand-logo{width:38px;height:38px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:#34161B;object-fit:cover;flex:none}
.topnav{display:none;gap:2px}
.top-end{margin-inline-start:auto;display:flex;align-items:center;gap:8px}
.top-end .btn{height:38px;padding:0 14px}
[hidden]{display:none!important}
.login{max-width:400px;margin:6vh auto 0}
.topnav button{appearance:none;border:0;background:none;padding:8px 14px;border-radius:10px;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:8px;position:relative}
.topnav button svg{width:18px;height:18px}
.topnav button:hover{color:var(--ink);background:var(--surface-2)}
.topnav button[aria-current="page"]{color:var(--ink);font-weight:500}
.topnav button[aria-current="page"]::after{content:"";position:absolute;bottom:-13px;left:12px;right:12px;border-top:2px dashed var(--brass)}

.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar button{appearance:none;border:0;background:none;color:var(--muted);font-size:.74rem;padding:10px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;cursor:pointer}
.tabbar button svg{width:22px;height:22px}
@media (min-width:600px){.tabbar button{font-size:.85rem;padding:12px 4px 11px}}
.tabbar button[aria-current="page"]{color:var(--ink);font-weight:500}
.tabbar button[aria-current="page"]::before{content:"";position:absolute;top:0;left:24%;right:24%;border-top:2px dashed var(--brass)}

main{max-width:1180px;margin:0 auto;padding:22px max(16px,env(safe-area-inset-right,0px)) 110px max(16px,env(safe-area-inset-left,0px))}
.topbar-in{max-width:1180px!important}
@media (min-width:600px){main{padding-top:28px;padding-inline:24px}.page-head h1{font-size:1.9rem}}
@media (min-width:1024px){main{padding-inline:32px}body{font-size:17px}}
@media (min-width:760px){.topnav{display:flex}.tabbar{display:none}main{padding-bottom:56px}}

/* page head */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.page-head h1{font-size:1.7rem;line-height:1.25}
.page-head h1::after{content:"";display:block;width:56px;border-top:2px dashed var(--brass);margin-top:10px}
.sub{margin:6px 0 0;color:var(--muted);font-size:.92rem}
.detail-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.back{appearance:none;border:0;background:none;color:var(--muted);padding:6px 0;display:flex;align-items:center;gap:4px;cursor:pointer;font-size:.95rem}
.back:hover{color:var(--ink)}
.back svg{width:18px;height:18px}

/* buttons */
.btn{appearance:none;border:1px solid transparent;background:var(--ink);color:var(--bg);border-radius:11px;padding:0 18px;height:46px;font-weight:500;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:translateY(1px)}
.btn.brass{background:var(--brass);color:#1D1B36}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.danger{background:var(--neg);color:#fff}
.btn.danger-ghost{background:transparent;color:var(--neg);border-color:var(--line)}
.btn.block{width:100%}
.icon-btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);width:40px;height:40px;border-radius:11px;display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn:hover{color:var(--ink)}
.icon-btn svg{width:18px;height:18px}
.icon-btn.sm{width:32px;height:32px;border-radius:9px;border-color:transparent;background:transparent}
.icon-btn.sm:hover{background:var(--neg-soft);color:var(--neg)}

/* list cards */
.list{display:grid;gap:10px}
@media (min-width:600px){.list{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}}
.row-card{appearance:none;text-align:start;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer}
@media (hover:hover){.row-card:hover{border-color:var(--brass)}}
.row-card:active{border-color:var(--brass)}
.row-card h3{font-size:1.08rem;font-weight:500}
.row-meta{color:var(--muted);font-size:.85rem;margin-top:4px;display:flex;gap:12px;flex-wrap:wrap}
.row-val{text-align:end;flex:none}
.row-val strong{display:block;font-size:1.15rem;font-weight:600}
.row-val span{font-size:.78rem;color:var(--muted)}

/* panels & forms */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
.panel h2{font-size:1.05rem;margin-bottom:12px}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.panel-head h2{margin:0}
.panel-head span{color:var(--muted);font-size:.86rem}
.grid2{display:grid;gap:14px;margin-bottom:14px}
.grid2 .panel{margin:0}
.grid1{margin-bottom:14px}.grid1 .panel{margin:0}
@media (min-width:640px){.grid2{grid-template-columns:1fr 1fr}}
.field{display:block;margin-bottom:10px}
.field>span{display:block;font-size:.82rem;color:var(--muted);margin-bottom:5px}
input[type=text],input[type=password],input[type=email],input[type=tel],input[type=search],input[type=date],input[type=month]{width:100%;height:46px;border:1px solid var(--line);background:var(--surface-2);border-radius:11px;padding:0 12px;font-size:16px;min-width:0}
/* آيفون: حقول التاريخ لها عرض داخلي يطلعها برا الشاشة */
input[type=date],input[type=month]{-webkit-appearance:none;appearance:none;display:block;max-width:100%;line-height:44px}
input[type=date]::-webkit-date-and-time-value,input[type=month]::-webkit-date-and-time-value{text-align:center;margin:0;min-width:0}
/* الصفحة تتحرك فوق وتحت بس */
html,body{overflow-x:clip;overscroll-behavior:none}
#view{will-change:transform}
@supports not (overflow-x:clip){body{overflow-x:hidden}}
input:focus{border-color:var(--focus);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 22%,transparent)}
input.err{border-color:var(--neg);box-shadow:0 0 0 3px color-mix(in srgb,var(--neg) 20%,transparent)}
.inline{display:flex;gap:8px}
.inline input{flex:1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.preview{min-height:1.4em;font-size:.86rem;color:var(--brass);margin:-2px 0 10px}

.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;margin-bottom:10px}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;inset:0;cursor:pointer}
.seg span{display:block;text-align:center;padding:8px 4px;border-radius:9px;color:var(--muted);font-size:.95rem}
.seg input:checked+span{background:var(--ink);color:var(--bg);font-weight:500}
.seg input:focus-visible+span{outline:2px solid var(--focus)}

/* date bar */
.date-bar{display:flex;gap:8px;align-items:center;margin-bottom:16px}
.date-bar input{flex:1;max-width:260px}
.date-bar .btn{height:40px;padding:0 14px}
@media (max-width:480px){.day-bar{gap:5px}.day-bar .icon-btn{width:36px}.day-bar .btn{padding:0 10px}.day-bar input{padding:0 6px!important}}
/* ما يتحدد النص بالضغط المطول، إلا داخل الخانات */
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input,textarea,[contenteditable]{-webkit-user-select:text;user-select:text}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:14px}
.stat{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.stat span{display:block;font-size:.78rem;color:var(--muted)}
.stat strong{font-size:1.15rem;font-weight:600}
.stat.pos strong{color:var(--pos)}
.stat.neg strong{color:var(--neg)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 12px}
.chip{font-size:.8rem;background:var(--surface-2);border-radius:999px;padding:3px 10px;color:var(--muted)}
.chip b{color:var(--ink);font-weight:500}

/* stitched hero: the one memorable element */
.hero{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px 22px;margin-bottom:14px}
.hero::after{content:"";position:absolute;inset:7px;border:1.5px dashed var(--brass);border-radius:14px;pointer-events:none;opacity:.75}
.hero-label{color:var(--muted);font-size:.9rem}
.hero-num{display:block;font-size:2.6rem;font-weight:600;line-height:1.2;margin:4px 0 10px;letter-spacing:-.01em}
.hero-num small{font-size:.38em}
.hero-row{display:flex;gap:18px;flex-wrap:wrap;font-size:.88rem;color:var(--muted)}
.hero-row b{color:var(--ink);font-weight:500}

/* items */
.item{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item-main{flex:1;min-width:0}
.item-title{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item-note{color:var(--muted);font-size:.85rem;overflow-wrap:anywhere}
.item-amt{font-weight:600;flex:none}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.tag{font-size:.76rem;padding:2px 9px;border-radius:999px;font-weight:500}
.tag.in{background:var(--pos-soft);color:var(--pos)}
.tag.out{background:var(--neg-soft);color:var(--neg)}
.tag.brass{background:var(--brass-soft);color:var(--brass)}
.empty{color:var(--muted);text-align:center;padding:20px 8px;margin:0;font-size:.92rem}
.empty-big{background:var(--surface);border:1.5px dashed var(--line);border-radius:18px;padding:36px 20px;text-align:center;color:var(--muted)}
.empty-big p{margin:0 0 14px}

/* tables */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:.9rem;min-width:520px}
th{font-weight:500;color:var(--muted);font-size:.78rem;text-align:start;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td.num,th.num{text-align:end}
tbody tr:last-child td{border-bottom:0}
tfoot td{font-weight:600;border-top:2px dashed var(--brass);border-bottom:0;padding-top:12px}
.linkish{appearance:none;border:0;background:none;padding:0;cursor:pointer;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
.linkish:hover{text-decoration-color:var(--brass)}
tr.sel td{background:var(--brass-soft)}

.section-title{font-size:1.2rem;margin:26px 0 12px;display:flex;align-items:center;gap:10px}
.section-title::before{content:"";width:18px;border-top:2px dashed var(--brass)}
.range{display:grid;gap:8px;grid-template-columns:1fr;margin-bottom:6px}
@media (min-width:600px){.range{grid-template-columns:1.2fr 1fr 1fr;gap:12px}}
@media (min-width:900px){table{font-size:.95rem}td{padding:12px 10px}}

.loading{color:var(--muted);padding:24px 0;text-align:center}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,9,25,.48);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
@media (min-width:600px){.scrim{align-items:center}}
.dialog{background:var(--surface);border-radius:20px;padding:22px;width:100%;max-width:420px;border:1px solid var(--line);animation:pop .18s ease-out}
.dialog h3{font-size:1.15rem;margin-bottom:12px}
.dialog p{margin:0 0 12px;color:var(--muted)}
.mact{display:flex;flex-direction:column;gap:8px;margin-top:16px}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:.92rem;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.toast.undo{pointer-events:auto;display:flex;align-items:center;gap:14px;padding:8px 18px 8px 8px}
.toast .undo-btn{appearance:none;border:0;border-radius:9px;background:#E6BE6E;color:#1D1B36;font:inherit;font-weight:600;padding:7px 16px;cursor:pointer}
.sync{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;height:34px;padding:0 12px;display:flex;align-items:center;gap:7px;font-size:.8rem;color:var(--muted);cursor:pointer;white-space:nowrap;flex:none}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sync[data-s="synced"] i{background:var(--pos)}
.sync[data-s="saving"] i,.sync[data-s="connecting"] i{background:var(--brass);animation:blink 1s ease-in-out infinite}
.sync[data-s="offline"] i{background:var(--brass)}
.sync[data-s="offline"]{color:var(--brass);border-color:var(--brass-soft);background:var(--brass-soft)}
.sync[data-s="error"] i{background:var(--neg)}
.sync[data-s="error"]{color:var(--neg);border-color:var(--neg-soft);background:var(--neg-soft)}
@keyframes blink{50%{opacity:.25}}
.info-rows{display:grid;gap:8px;margin:0 0 6px}
.info-rows div{display:flex;justify-content:space-between;gap:10px;background:var(--surface-2);border-radius:10px;padding:9px 12px;font-size:.92rem}
.info-rows b{font-weight:500}

/* مديونية العملاء */

/* الحروف اللي لها ذيل تحت (ح خ ج ي) كانت تنقص من تحت في الآيفون */
@font-face{font-family:"Readex Input";src:url(readex-input.woff) format("woff");font-weight:100 900;font-display:swap}
/* نفس خط Readex بس بمقاسات أعمق تحت، عشان الآيفون ما يقص ذيل ح خ ج ي داخل الخانات */
input,textarea,select{font-family:"Readex Input","Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif}
input[type=text],input[type=password],input[type=email],input[type=tel],input[type=search]{line-height:normal;padding-top:0;padding-bottom:0;-webkit-appearance:none;appearance:none}

/* ===================== تلميع التصميم (Impeccable) ===================== */
/* الغرزة المتقطعة هي توقيع دثار: نخليها في البطاقة الرئيسية والتبويب والمجاميع بس، مو في كل عنوان */
.page-head{align-items:center;margin-bottom:18px}
.page-head h1{font-size:1.6rem;letter-spacing:-.005em}
.page-head h1::after{display:none}

  .page-head{flex-wrap:nowrap;align-items:flex-start}

  .page-head>.btn{height:40px;padding:0 14px;font-size:.9rem;flex:none;margin-top:3px}
  .hide-sm{display:none}
}
.section-title::before{display:none}
.section-title{font-size:1.12rem;margin:28px 0 12px}
/* أزرار التعديل والحذف جنب كل بطاقة: أهدى وما تزاحم البطاقة */
.row-wrap{gap:4px}
.row-btns{gap:2px;justify-content:center}
.row-wrap .row-btns .icon-btn{width:38px;height:38px;flex:none;border-color:transparent;background:transparent;border-radius:10px}
.row-wrap .row-btns .icon-btn svg{width:17px;height:17px}
.edit-btn:hover,.edit-btn:focus-visible{background:var(--surface-2)}
/* الإشارة + و − تطلع قبل الرقم مو بعده */
.item-amt{direction:ltr;unicode-bidi:isolate}
/* أرقام أوضح في البطاقات */
.row-val strong{font-size:1.2rem;letter-spacing:-.01em}
.stat strong{letter-spacing:-.01em}
.panel h2{font-size:1rem}
.field>span{font-size:.8rem}

/* ===================== الحركة (أسلوب إميل) ===================== */
:root{--ease-out:cubic-bezier(.23,1,.32,1);--ease-drawer:cubic-bezier(.32,.72,0,1)}
/* كل ضغطة لها رد فعل: الزر ينضغط شوي */
.btn,.icon-btn,.row-card,.back,.tabbar button,.topnav button,.toast .undo-btn{transition:transform .16s var(--ease-out),background-color .16s,color .16s,border-color .16s,filter .16s}
.btn:active,.toast .undo-btn:active{transform:scale(.97)}
.icon-btn:active{transform:scale(.9)}
.row-card:active{transform:scale(.985)}
.tabbar button:active{transform:scale(.92)}
.back:active{transform:translateX(3px)}
/* خط التبويب ينرسم لما تنتقل */
@keyframes stitchIn{from{transform:scaleX(0)}}
.tabbar button[aria-current="page"]::before,.topbar .topnav button[aria-current="page"]::after{animation:stitchIn .35s var(--ease-out)}
/* كاش / مدى / فيزا: الاختيار ينزلق بين الخيارات */
@supports selector(:has(a)){
.seg{position:relative}
.seg::before{content:"";position:absolute;top:4px;bottom:4px;width:calc((100% - 16px)/3);inset-inline-start:calc(4px + var(--i,0) * ((100% - 16px)/3 + 4px));background:#4E1220;border-radius:9px;transition:inset-inline-start .3s var(--ease-drawer)}
.seg:has(label:nth-child(2) input:checked){--i:1}
.seg:has(label:nth-child(3) input:checked){--i:2}
.seg:not(:has(input:checked))::before{opacity:0}
.seg span{position:relative;z-index:1;transition:color .2s}
.seg input:checked+span{background:transparent!important;color:#fff}
}
/* الصفحة تدخل بهدوء لما تنتقل لها */
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}}
#view.enter>*{animation:viewIn .26s var(--ease-out) both}
/* النوافذ: من تحت في الجوال وتقفلها بسحبة، وفي التابلت تكبر من الوسط */
@keyframes fadeIn{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}
@keyframes sheetIn{from{transform:translateY(calc(100% + 40px))}}
@keyframes sheetOut{to{transform:translateY(calc(100% + 40px))}}
@keyframes popIn{from{opacity:0;transform:scale(.96)}}
@keyframes popOut{to{opacity:0;transform:scale(.97)}}
.scrim{animation:fadeIn .22s ease-out}
.scrim.out{animation:fadeOut .2s ease-in forwards;pointer-events:none}
.dialog{animation:sheetIn .42s var(--ease-drawer);touch-action:pan-y}
.scrim.out .dialog{animation:sheetOut .22s cubic-bezier(.4,0,1,1) forwards}
.scrim.out.dragged .dialog{animation:none}
@media (max-width:599px){.dialog{position:relative;padding-top:26px}.dialog::before{content:"";position:absolute;top:9px;left:50%;width:38px;height:5px;margin-left:-19px;border-radius:9px;background:var(--line)}}
@media (min-width:600px){.dialog{animation:popIn .2s var(--ease-out)}.scrim.out .dialog{animation:popOut .15s ease-in forwards}}
/* رسالة التنبيه تطلع من تحت بنعومة */
.toast{transform:translate(-50%,12px) scale(.96);transition:opacity .2s ease,transform .32s var(--ease-drawer)}
.toast.show{transform:translate(-50%,0) scale(1)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* الأجهزة */
.dev-chip{gap:5px;padding:0 10px;font-variant-numeric:tabular-nums}
.dev-chip svg{width:16px;height:16px}
.topbar .dev-chip{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.28);color:#fff}

/* صف أسماء الأعمدة تحت الإجمالي */

.seg.four:has(label:nth-child(4) input:checked){--i:3}}
.note-sm{font-size:.78rem;color:var(--muted);margin:-2px 0 10px}

/* ملف PDF: الرسومات عمود واحد، كل رسم لحاله (عشان تتوزع على الصفحات بدون فراغات) */

.pdf-paged .charts{display:grid!important;grid-template-columns:1fr 1fr;gap:12px;align-items:start}

<script type="module" onerror="window.dispatchEvent(new Event('fb-fail'))">

let app,auth,db;
const Q=(ref,cons)=>cons.length?query(ref,...cons):ref;
const wrapQ=(ref,cons=[])=>({where:(f,op,v)=>wrapQ(ref,cons.concat([where(f,op,v)])),get:()=>getDocs(Q(ref,cons)),onSnapshot:(opts,next,err)=>onSnapshot(Q(ref,cons),opts,next,err)});
const wrapDoc=d=>({id:d.id,set:o=>setDoc(d,o),update:p=>updateDoc(d,p),delete:()=>deleteDoc(d),collection:c=>wrapColl(collection(d,c))});
const wrapColl=c=>Object.assign(wrapQ(c),{doc:id=>wrapDoc(id?doc(c,id):doc(c))});
const authFn=function(){
  // بدون popupRedirectResolver: ما يحمّل صفحة من سيرفر Firebase قبل ما يتأكد من الدخول

      catch(e){db=initializeFirestore(app,{});window.__persist='fail:'+((e&&e.code)||'')}}
    return{collection:p=>wrapColl(collection(db,p)),

      terminate:()=>terminate(db),clearPersistence:()=>clearIndexedDbPersistence(db)};

};

function modal({title,body='',actions}){
  return new Promise(res=>{
    const root=$('#modal-root');const prev=document.activeElement;

const WINDOWED=['entries','workerTx'];
const CUTOFF_M=shiftMonth(curMonth(),-3),CUTOFF=CUTOFF_M+'-01';
const LIVE={},OLD={},LOADED={};COLS.forEach(c=>{LIVE[c]=[];OLD[c]={}});
function merge(c){let o=Object.values(OLD[c]);if(o.length){const ids=new Set(LIVE[c].map(x=>x.id));o=o.filter(x=>!ids.has(x.id))}S[c]=o.length?LIVE[c].concat(o):LIVE[c]}
async function ensureRange(from,to){
  if(!store.root||!from||!to)return;
  const ms=monthsIn(from,to).filter(m=>m<CUTOFF_M&&!LOADED[m]);if(!ms.length)return;
  ms.forEach(m=>LOADED[m]='loading');
  const a=ms[0]+'-01',b=monthBounds(ms[ms.length-1])[1];
  toast('جارٍ جلب بيانات الأشهر القديمة…');
  try{
    for(const c of WINDOWED){
      const snap=await store.root.collection(c).where('date','>=',a).where('date','<=',b).get();
      snap.docs.forEach(d=>{const x={...d.data(),id:d.id};if(x.date&&ms.includes(x.date.slice(0,7)))OLD[c][d.id]=x});merge(c);
    }
    ms.forEach(m=>LOADED[m]=true);
  }catch(e){ms.forEach(m=>delete LOADED[m]);toast('تعذّر جلب بيانات الأشهر القديمة، تأكد من الاتصال بالإنترنت')}
  refresh();
}
function needData(){
  const k=UI.detail?UI.detail.type:UI.tab;
  if(k==='branch'||k==='branches'){const m=UI.date.slice(0,7)+'-01';ensureRange(m,m)}
  else if(k==='worker'){const m=UI.wMonth+'-01';ensureRange(m,m)}
  if(k==='workers'||k==='worker'||k==='report')ensureWorkerHistory();
  if(k==='report'){let a=UI.rFrom,b=UI.rTo;if(a>b)[a,b]=[b,a];ensureRange(a,b)}
  if(k==='year'){const y=UI.year||+today().slice(0,4);ensureRange(y+'-01-01',y+'-12-31');ensureWorkerHistory()}
}
const LS_KEY='daftar-hesabat-v1';
const store={
  root:null,
  loadLocal(){try{const d=JSON.parse(localStorage.getItem(LS_KEY)||'{}');COLS.forEach(c=>S[c]=Array.isArray(d[c])?d[c]:[])}catch(e){}},
  saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){toast('تعذّر الحفظ على هذا الجهاز')}},
  async add(c,o){o={...o,createdAt:Date.now()};
    if(this.root){const ref=this.root.collection(c).doc();
      if(WINDOWED.includes(c)&&o.date<CUTOFF){OLD[c][ref.id]={...o,id:ref.id};merge(c);refresh()}
      track(ref.set(o));return ref.id}
    else{const id=rid();S[c]=[...S[c],{...o,id}];this.saveLocal();refresh();return id}},
  async update(c,id,p){
    if(this.root){if(OLD[c]&&OLD[c][id]){OLD[c][id]={...OLD[c][id],...p};merge(c);refresh()}
      track(this.root.collection(c).doc(id).update(p))}
    else{S[c]=S[c].map(x=>x.id===id?{...x,...p}:x);this.saveLocal();refresh()}},
  async restore(c,x){const {id,...o}=x;
    if(this.root){if(WINDOWED.includes(c)&&o.date&&o.date<CUTOFF){OLD[c][id]={...x};merge(c);refresh()}
      track(this.root.collection(c).doc(id).set(o))}
    else{S[c]=[...S[c].filter(y=>y.id!==id),x];this.saveLocal();refresh()}},
  async remove(c,id){
    if(this.root){if(OLD[c]&&OLD[c][id]){delete OLD[c][id];merge(c);refresh()}
      track(this.root.collection(c).doc(id).delete())}
    else{S[c]=S[c].filter(x=>x.id!==id);this.saveLocal();refresh()}}
};

/* ---------- sync status ---------- */
const SYNC={pending:0,cache:{},lastSync:null,err:null};
function track(p){
  SYNC.pending++;renderSync();
  p.then(()=>{SYNC.pending--;SYNC.lastSync=Date.now();SYNC.err=null;renderSync()},
    e=>{SYNC.pending--;SYNC.err=e;renderSync();toast('لم تُحفظ آخر عملية في قاعدة البيانات')});
}
function syncState(){
  if(!store.root)return'local';
  if(SYNC.err)return'error';
  const fromCache=Object.values(SYNC.cache).some(Boolean);
  if(!navigator.onLine||(fromCache&&SYNC.lastSync))return'offline';
  if(!SYNC.lastSync)return'connecting';
  if(SYNC.pending)return'saving';
  return'synced';
}
const SYNC_LABEL={local:'على الجهاز فقط',error:'خطأ بالحفظ',offline:'بدون إنترنت',connecting:'جارٍ الاتصال',saving:'جارٍ الحفظ',synced:'متزامن'};
function renderSync(){
  const el=$('#sync');if(!el)return;const st=syncState();
  el.dataset.s=st;
  el.querySelector('span').textContent=st==='offline'&&SYNC.pending?`بانتظار الرفع (${SYNC.pending})`:SYNC_LABEL[st];
}
window.addEventListener('online',renderSync);window.addEventListener('offline',renderSync);

/* قياس سرعة الفتح: كل رقم = الوقت من لحظة فتح التطبيق */
function speedRows(){
  const T=window.__T||{},nav=(performance.getEntriesByType&&performance.getEntriesByType('navigation')[0])||{};
  const sec=v=>v==null?'—':(v/1000).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})+' ث';
  const sw=!!(navigator.serviceWorker&&navigator.serviceWorker.controller);
  const ps=window.__persist==='ok'?'يعمل':window.__persist?'لا يعمل ('+esc(window.__persist.slice(5))+')':'—';
  const rows=[['وصول الصفحة',sec(nav.responseEnd)+(sw?' (من الجهاز)':' (من الإنترنت)')],['تحميل مكتبات Firebase',sec(T.libs)],['التأكد من تسجيل الدخول',sec(T.auth)],
    ['عرض البيانات',sec(T.data)+(window.__dataCache==null?'':window.__dataCache?' (من الجهاز)':' (من الإنترنت)')],['اختفاء شاشة التحميل',sec(T.shown)],['التزامن مع الإنترنت',sec(T.synced)],['حفظ البيانات على الجهاز',ps],['نسخة التطبيق',APP_VERSION]];

}

/* ---------- calculations ---------- */
/* عمولة نقاط البيع: مدى 0.8٪ وفيزا 2.5٪ */
const FEES={mada:0.008,visa:0.025};
const pct=v=>(v*100).toLocaleString('en-US',{maximumFractionDigits:2})+'٪';
function sumEntries(list){
  const r={in:0,out:0,cash:0,mada:0,visa:0};
  list.forEach(x=>{if(x.kind==='in'){r.in+=x.amount;r[x.method]=(r[x.method]||0)+x.amount}else r.out+=x.amount});
  r.madaFee=r.mada*FEES.mada;r.visaFee=r.visa*FEES.visa;r.fee=r.madaFee+r.visaFee;
  r.net=r.in-r.fee-r.out;
  return r;
}
function repTotals(repId,from,to){
  const tx=S.repTx.filter(x=>x.repId===repId);
  const inR=tx.filter(x=>inRange(x.date,from,to));
  const upTo=tx.filter(x=>x.date<=to);
  return{added:sum(inR.filter(x=>x.kind==='add'),x=>x.amount),paid:sum(inR.filter(x=>x.kind==='pay'),x=>x.amount),
    balance:sum(upTo,x=>x.kind==='add'?x.amount:-x.amount)};
}
/* الراتب حسب الشهر: تغيير الراتب يطبق من الشهر اللي تغير فيه وبعده */
function salaryFor(w,m){
  const h=(w.salaryHist&&w.salaryHist.length?w.salaryHist:[{from:(w.startMonth||'0000-00'),amount:w.salary||0}]).slice().sort((a,b)=>a.from.localeCompare(b.from));
  let v=null;h.forEach(x=>{if(x.from<=m)v=x.amount});return v||0;
}
function monthsIn(from,to){const out=[];let m=from.slice(0,7);const end=to.slice(0,7);while(m<=end){out.push(m);m=shiftMonth(m,1)}return out}
const W_SALARIED=w=>true,W_PIECES=w=>false;
/* ---------- رصيد العامل المتراكم ----------
   الرصيد = كل اللي استحقه من أول ما بدأ (رواتب + ثياب) − كل اللي دفعته له (دفعات وسلف) */
function wFirstMonth(w){const h=(w.salaryHist||[]).map(x=>x.from).filter(x=>x&&x>'0000-00').sort();return h[0]||w.startMonth||(w.createdAt?isoDate(new Date(w.createdAt)).slice(0,7):curMonth())}
const wStopped=w=>!!(w&&w.end);
function wSalaryOn(w,m){return (m>=wFirstMonth(w)&&(!w.end||m<=w.end))?salaryFor(w,m):0}
function workerBalance(w,upto){
  const m=upto.slice(0,7),fm=wFirstMonth(w);
  const sal=(W_SALARIED(w)&&fm<=m)?sum(monthsIn(fm+'-01',upto),mm=>wSalaryOn(w,mm)):0;
  const tx=S.workerTx.filter(x=>x.workerId===w.id&&x.date<=upto);
  const pcs=W_PIECES(w)?sum(tx.filter(x=>x.kind==='pieces'),x=>x.amount):0;
  const paid=sum(tx.filter(x=>x.kind==='exp'),x=>x.amount);
  return{earned:sal+pcs,paid,balance:sal+pcs-paid};
}
let WT_ALL=false,WT_LOADING=false;
async function ensureWorkerHistory(){
  if(WT_ALL||WT_LOADING)return;
  if(!store.root){WT_ALL=true;return}
  WT_LOADING=true;
  try{const snap=await store.root.collection('workerTx').where('date','<',CUTOFF).get();
    snap.docs.forEach(d=>{OLD.workerTx[d.id]={...d.data(),id:d.id}});merge('workerTx');WT_ALL=true}
  catch(e){toast('تعذّر جلب سجلات العمال القديمة، تأكد من الاتصال بالإنترنت')}
  WT_LOADING=false;refresh();
}
const balTxt=v=>WT_ALL?fmt(v):'…';
function workerTotals(wid,from,to){
  const w=S.workers.find(x=>x.id===wid)||{};
  const tx=S.workerTx.filter(x=>x.workerId===wid&&x.kind==='exp'&&inRange(x.date,from,to));
  const salary=sum(monthsIn(from,to),m=>wSalaryOn(w,m)),ded=sum(tx,x=>x.amount);
  return{salary,ded,net:salary-ded,tx,gross:salary};
}

/* السحب يمين ويسار: الصفحة تمشي مع الإصبع، وإذا سحبت كفاية تنتقل للقسم اللي بعده */
(function(){

    if(el.matches&&el.matches('input,textarea,select,#modal-root *,.topbar *,.tabbar *'))return true;
    if(el.scrollWidth>el.clientWidth+2&&/(auto|scroll)/.test(getComputedStyle(el).overflowX))return true}return false};
  const view=()=>$('#view');

    v.style.transform=x?`translate3d(${x}px,0,0)`:'';v.style.opacity=x?String(Math.max(.55,1-Math.abs(x)/W()*.6)):''};

    const t=e.touches[0];x0=t.clientX;y0=t.clientY;t0=Date.now();dx=0;mode='wait'},{passive:true});
  document.addEventListener('touchmove',e=>{if(!mode||mode==='v')return;const t=e.touches[0],ddx=t.clientX-x0,ddy=t.clientY-y0;
    if(mode==='wait'){if(Math.abs(ddx)<8&&Math.abs(ddy)<8)return;mode=Math.abs(ddx)>Math.abs(ddy)*1.3?'h':'v';if(mode==='v')return}
    e.preventDefault();dx=ddx;set(target(dx)?dx:dx*.25,false)},{passive:false});
  const end=()=>{if(mode!=='h'){mode=null;return}mode=null;
    const n=target(dx),fast=Math.abs(dx)/(Date.now()-t0)>.5&&Math.abs(dx)>40;
    if(!n||!(Math.abs(dx)>W()*.28||fast)){set(0,true);setTimeout(done,230);return}
    busy=true;const dir=dx>0?1:-1;set(dir*W(),true);
    setTimeout(()=>{NO_ENTER=true;go(n);NO_ENTER=false;set(-dir*W()*.35,false);void view().offsetWidth;set(0,true);setTimeout(done,230)},200)};
  document.addEventListener('touchend',end,{passive:true});document.addEventListener('touchcancel',()=>{if(mode==='h'){mode=null;set(0,true);setTimeout(done,230)}else mode=null},{passive:true});
})();

/* ---------- مديونية العملاء ---------- */
function custTotals(id){const tx=S.custTx.filter(x=>x.custId===id).sort(byDateAsc);
  const debt=sum(tx.filter(x=>x.kind==='debt'),x=>x.amount),paid=sum(tx.filter(x=>x.kind==='pay'),x=>x.amount);
  return{tx,debt,paid,bal:debt-paid,last:tx[tx.length-1]}}
const fmtLong=s=>parseD(s).toLocaleDateString(LOC,{weekday:'short',day:'numeric',month:'short',year:'numeric'});
/* رقم الواتساب: 05xxxxxxxx يصير 9665xxxxxxxx */
/* الأرقام العربية (٠٥٤…) تتحول لأرقام عادية عشان كل الأرقام بنفس الشكل والحجم */
function normPhone(p){return String(p||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).trim()}
function waNum(p){let d=String(p||'').replace(/[٠-٩]/g,x=>AR.indexOf(x)).replace(/\D/g,'');if(!d)return'';
  if(d.startsWith('00'))d=d.slice(2);if(d.startsWith('05')&&d.length===10)d='966'+d.slice(1);else if(d.startsWith('5')&&d.length===9)d='966'+d;return d.length>=10?d:''}
const debtItemRow=(d='',p='')=>`<div class="debt-item"><input type="text" class="di-d" placeholder="الصنف، مثل: قماش ياباني" value="${esc(d)}"><input type="text" class="di-p" inputmode="decimal" placeholder="السعر" value="${esc(p)}"><button type="button" class="icon-btn sm di-x" data-act="delDebtItem" aria-label="حذف الصنف">${svg('x')}</button></div>`;
function debtItems(){return[...document.querySelectorAll('#debtItems .debt-item')].map(r=>({el:r,d:r.querySelector('.di-d').value.trim(),p:num(r.querySelector('.di-p').value),raw:r.querySelector('.di-p').value.trim()}))}
function debtSumUpd(){const el=$('#debtSum');if(el)el.textContent=fmt(sum(debtItems(),x=>x.p>0?x.p:0))}
document.addEventListener('input',e=>{if(e.target.closest&&e.target.closest('#debtItems'))debtSumUpd();if(e.target.id==='custQ'){UI.cq=e.target.value;refresh()}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||!e.target.closest||!e.target.closest('#debtItems'))return;e.preventDefault();
  const r=e.target.closest('.debt-item');if(e.target.classList.contains('di-d'))r.querySelector('.di-p').focus();else{const nx=r.nextElementSibling;if(nx)nx.querySelector('.di-d').focus();else ACT.custDebt()}});
async function addCustomer(){
  const r=await modal({title:'إضافة عميل',body:`<label class="field"><span>اسم العميل</span><input type="text" name="name"></label><label class="field"><span>رقم الجوال</span><input type="tel" name="phone" inputmode="tel" dir="ltr" placeholder="05xxxxxxxx"></label>`,
    actions:[{key:'ok',label:'إضافة'},{key:'cancel',label:'إلغاء',cls:'ghost'}]});
  if(!r)return;const name=r.values.name.trim(),phone=normPhone(r.values.phone);if(!name){toast('اكتب اسم العميل');return}
  let id=null;if(await safe(async()=>{id=await store.add('customers',{name,phone})})){toast(`تمت إضافة ${name}`);if(typeof id==='string')go('debts',{type:'cust',id})}}
async function editCustomer(id){const c=S.customers.find(x=>x.id===id);if(!c)return;
  const r=await modal({title:'تعديل بيانات العميل',body:`<label class="field"><span>الاسم</span><input type="text" name="name" value="${esc(c.name)}"></label><label class="field"><span>رقم الجوال</span><input type="tel" name="phone" inputmode="tel" dir="ltr" value="${esc(c.phone||'')}" placeholder="05xxxxxxxx"></label>`,
    actions:[{key:'save',label:'حفظ'},{key:'cancel',label:'إلغاء',cls:'ghost'}]});
  if(!r)return;const name=r.values.name.trim(),phone=normPhone(r.values.phone);if(!name){toast('اكتب الاسم');return}
  if(name===c.name&&phone===(c.phone||''))return;
  if(await safe(()=>store.update('customers',id,{name,phone})))toast('تم حفظ التعديل')}

/* الكيبورد في الآيفون يغطي النافذة: نخلي النافذة تقعد فوق الكيبورد دايم */
(function(){const vv=window.visualViewport;if(!vv)return;
  const fit=()=>{const sc=document.querySelector('#modal-root .scrim');if(!sc)return;
    const kb=innerHeight-vv.height>80;
    sc.style.top=kb?vv.offsetTop+'px':'';sc.style.height=kb?vv.height+'px':'';sc.style.bottom=kb?'auto':'';sc.classList.toggle('kb',kb);
    const a=document.activeElement;if(kb&&a&&sc.contains(a))a.scrollIntoView({block:'nearest'})};
  vv.addEventListener('resize',fit);vv.addEventListener('scroll',fit);
  document.addEventListener('focusin',()=>setTimeout(fit,60));
  new MutationObserver(fit).observe(document.getElementById('modal-root'),{childList:true});
})();
/* ---------- الأجهزة: كل جهاز يسجل نفسه لما ينفتح التطبيق بس (بدون تبليغ مستمر) ---------- */
const DEV_KEY='dithar-device',DEV_GAP=10*60*1000;
function myDevice(){let d=null;try{d=JSON.parse(localStorage.getItem(DEV_KEY)||'null')}catch(e){}
  if(!d||!d.id){d={id:rid()+rid(),name:'',fresh:true,v:2};saveMyDevice(d)}
  if(!d.v){d.v=2;d.fresh=true;saveMyDevice(d)}   /* مرة وحدة للأجهزة القديمة: تنظيف النسخ المكررة */
  return d}
function saveMyDevice(d){try{localStorage.setItem(DEV_KEY,JSON.stringify(d))}catch(e){}}
function guessDevice(){const u=navigator.userAgent;
  if(/iPad/.test(u)||(/Macintosh/.test(u)&&navigator.maxTouchPoints>1))return'آيباد';
  if(/iPhone/.test(u))return'آيفون';
  if(/Android/.test(u))return /Mobile/.test(u)?'جوال أندرويد':'تابلت أندرويد';
  /* تابلت أندرويد بوضع سطح المكتب يقول عن نفسه لينكس */
  if(/Linux|X11|CrOS/.test(u)&&navigator.maxTouchPoints>0)return'تابلت أندرويد';
  return /Windows/.test(u)?'كمبيوتر ويندوز':/Macintosh/.test(u)?'ماك':'كمبيوتر'}
/* اسم تلقائي: الموديل لو المتصفح يعطيه (أندرويد)، أو تخمين من مقاس الشاشة (أبل) */
const SAMSUNG={'SM-X9':'Tab S9 Ultra','SM-X8':'Tab S9+','SM-X7':'Tab S9','SM-X6':'Tab S9 FE','SM-X5':'Tab S9 FE','SM-X2':'Tab A9+','SM-X1':'Tab A9','SM-T5':'Tab A','SM-T2':'Tab A','SM-T9':'Tab S7+','SM-T8':'Tab S7','SM-P6':'Tab S6 Lite','SM-S9':'Galaxy S','SM-A':'Galaxy A','SM-F9':'Galaxy Z Fold','SM-F7':'Galaxy Z Flip','SM-N9':'Galaxy Note'};
function appleName(){const w=Math.min(screen.width,screen.height),h=Math.max(screen.width,screen.height),k=w+'x'+h;
  const ph={'375x667':'آيفون SE','414x736':'آيفون Plus','375x812':'آيفون mini','414x896':'آيفون 11','390x844':'آيفون 12-14','428x926':'آيفون Pro Max','393x852':'آيفون 15','430x932':'آيفون 15 Pro Max','402x874':'آيفون 16 Pro','440x956':'آيفون 16 Pro Max','420x912':'آيفون Air'};
  const pd={'1024x1366':'آيباد برو 12.9','1032x1376':'آيباد برو 13','834x1194':'آيباد برو 11','834x1210':'آيباد برو 11','820x1180':'آيباد Air','810x1080':'آيباد 10.2','834x1112':'آيباد 10.5','744x1133':'آيباد ميني','768x1024':'آيباد'};
  return guessDevice()==='آيباد'?(pd[k]||'آيباد'):(ph[k]||'آيفون')}
function androidName(model){const kind=guessDevice();if(!model)return kind;model=model.trim();
  if(/^SM-/i.test(model)){const k=Object.keys(SAMSUNG).find(p=>model.toUpperCase().startsWith(p));const tab=/^SM-[XTP]/i.test(model);
    return (tab?'تابلت سامسونج ':'جوال سامسونج ')+(k?SAMSUNG[k]:model)}
  return kind+' '+model}
async function autoName(){const d=myDevice();if(d.auto)return d.auto;let n=guessDevice();
  try{if(/آيفون|آيباد/.test(n))n=appleName();
    else if(/أندرويد/.test(n)){let m='';
      if(navigator.userAgentData&&navigator.userAgentData.getHighEntropyValues){const v=await navigator.userAgentData.getHighEntropyValues(['model']);m=v.model||''}
      if(!m){const x=navigator.userAgent.match(/Android [\d.]+; ([^;)]+?)(?: Build|\))/);if(x&&x[1]!=='K')m=x[1]}
      n=androidName(m)}}catch(e){}
  d.auto=n;saveMyDevice(d);return n}
let devLastWrite=0;
/* بصمة الجهاز: نفس الجوال يعطي نفس البصمة حتى لو انحذف التطبيق وانضاف من جديد */
function devPrint(){const u=navigator.userAgent,os=(u.match(/OS (\d+)_(\d+)/)||u.match(/Android ([\d.]+)/)||[''])[0];
  let tz='';try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone}catch(e){}
  return [guessDevice(),Math.min(screen.width,screen.height)+'x'+Math.max(screen.width,screen.height),devicePixelRatio,os,tz,navigator.language].join('|')}
/* المتصفح في الجوال (سفاري أو كروم بدون تثبيت) ما ينحسب جهاز، النسخة المثبتة على الشاشة الرئيسية بس */
function countable(){const st=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  return st||!/آيفون|آيباد|أندرويد/.test(guessDevice())||!store.root}
let DEV_DEDUPE=false;
function dedupeDevices(){const d=myDevice();if(!d.fresh)return;
  if(store.root&&!(LIVE.devices&&LIVE.devices.__got)){DEV_DEDUPE=true;return}
  DEV_DEDUPE=false;const fp=devPrint();
  /* أول مرة يفتح هالجهاز بعد إعادة تثبيت: نشيل نسخه القديمة اللي بنفس البصمة */
  const dup=(S.devices||[]).filter(x=>x&&x.id!==d.id&&(x.fp?x.fp===fp:(!x.custom&&x.kind===guessDevice()&&x.name===d.auto)));
  if(store.root)dup.forEach(x=>{try{store.root.collection('devices').doc(x.id).delete().catch(()=>{})}catch(e){}});
  else{S.devices=S.devices.filter(x=>!dup.includes(x));store.saveLocal()}
  d.fresh=false;saveMyDevice(d)}
async function seenDevice(force){const d=myDevice();const now=Date.now();if(!countable())return;
  if(!force&&now-devLastWrite<DEV_GAP)return;devLastWrite=now;
  const auto=await autoName();
  const o={name:d.name||auto,custom:!!d.name,kind:guessDevice(),fp:devPrint(),lastSeen:now};
  if(store.root){try{store.root.collection('devices').doc(d.id).set(o).catch(()=>{})}catch(e){}}
  else{S.devices=[...S.devices.filter(x=>x.id!==d.id),{...o,id:d.id}];store.saveLocal()}
  pruneDevices();dedupeDevices();renderDevChip()}
/* أي جهاز ما فتح التطبيق 24 ساعة ينحذف من القائمة، ولو رجع يفتح يرجع بنفس اسمه */
function pruneDevices(){const me=myDevice().id,now=Date.now(),old=(S.devices||[]).filter(x=>x&&x.id!==me&&(!x.lastSeen||now-x.lastSeen>=DAY));
  if(!old.length)return;
  if(store.root)old.forEach(x=>{try{store.root.collection('devices').doc(x.id).delete().catch(()=>{})}catch(e){}});
  else{S.devices=S.devices.filter(x=>!old.includes(x));store.saveLocal()}}
/* لما ترجع للتطبيق من الخلفية نعتبرها فتحة جديدة (مرة كل 10 دقايق بالكثير) */
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&auth&&auth.currentUser)seenDevice(false)});
async function renameDevice(){const d=myDevice(),auto=await autoName();
  const r=await modal({title:'اسم هذا الجهاز',body:`<p>الاسم الذي يظهر في قائمة الأجهزة. إذا تركته فارغًا يعود للاسم التلقائي «${esc(auto)}».</p><label class="field"><span>اسم الجهاز</span><input type="text" name="name" value="${esc(d.name||'')}" placeholder="${esc(auto)}"></label>`,
    actions:[{key:'ok',label:'حفظ'},{key:'cancel',label:'إلغاء',cls:'ghost'}]});
  if(!r)return;const n=(r.values.name||'').trim().slice(0,40);
  if(n===(d.name||''))return;d.name=n;saveMyDevice(d);seenDevice(true);toast(n?'تم حفظ اسم الجهاز':'تمت العودة للاسم التلقائي')}
const DAY=24*60*60*1000;
function devWhen(t){const now=Date.now(),m=Math.round((now-t)/60000);
  if(m<2)return'الآن';if(m<60)return`قبل ${m} دقيقة`;
  const d=new Date(t),td=new Date();const same=d.toDateString()===td.toDateString();
  const y=new Date(now-DAY).toDateString()===d.toDateString();
  return same?'اليوم '+fmtTime(t):y?'أمس '+fmtTime(t):d.toLocaleDateString(LOC,{day:'numeric',month:'short'})+' '+fmtTime(t)}
function devList(){const me=myDevice().id,now=Date.now(),L=(S.devices||[]).filter(x=>x&&x.lastSeen&&(x.id===me||now-x.lastSeen<DAY)).map(x=>({...x}));
  /* جهازين بنفس الاسم التلقائي: نرقمهم ١ و ٢ بترتيب ثابت */
  const g={};L.forEach(x=>{const k=x.name||x.kind||'جهاز';(g[k]=g[k]||[]).push(x)});
  Object.values(g).forEach(a=>{if(a.length<2)return;a.sort((x,y)=>x.id<y.id?-1:1).forEach((x,i)=>{x.label=(x.name||x.kind)+' ('+(i+1)+')'})});
  return L.sort((a,b)=>(b.id===me)-(a.id===me)||b.lastSeen-a.lastSeen)}
function renderDevChip(){if(DEV_DEDUPE)dedupeDevices();const el=$('#devChip');if(!el)return;
  const n=devList().length||1;
  el.querySelector('span').textContent=n;el.title=`${n} ${n===1?'جهاز':'أجهزة'} فتحت التطبيق خلال آخر 24 ساعة`}
function devicesInfo(){const me=myDevice().id,L=devList(),act=L.length;
  const rows=L.length?L.map(x=>`<div class="dev-row"><i class="${Date.now()-x.lastSeen<15*60000?'on':''}"></i><div><b>${esc(x.label||x.name||x.kind||'جهاز')}</b>${x.id===me?' <span class="tag brass">هذا الجهاز</span>':''}<small>${esc(x.custom?(x.kind||''):(x.kind||'')+' (اسم تلقائي)')}</small></div><span>${devWhen(x.lastSeen)}</span></div>`).join(''):'<p class="empty">لا توجد أجهزة مسجلة حتى الآن.</p>';
  const p=modal({title:'الأجهزة',body:`<p>${act} ${act===1?'جهاز فتح':'أجهزة فتحت'} التطبيق خلال آخر 24 ساعة. الجهاز الذي لا يُفتح عليه التطبيق 24 ساعة يختفي من القائمة، ويعود عند فتحه.</p>${DEV_ERR?'<p class="warn-box">قواعد Firestore لا تسمح بقائمة الأجهزة حاليًا، لذلك يرى كل جهاز نفسه فقط. أضف <b>devices</b> في القواعد.</p>':''}<div class="dev-list">${rows}</div>`,
    actions:[{key:'rename',label:'تغيير اسم هذا الجهاز',cls:'ghost'},{key:'cancel',label:'تم',cls:'ghost'}]});
  p.then(r=>{if(r&&r.key==='rename')setTimeout(()=>renameDevice(),260)})}

/* أسماء الأعمدة تتكرر تحت المجموع، عشان ما تحتاج تطلع لفوق تشوف أي عمود */
function withFootHead(h){return h.replace(/<thead><tr>([\s\S]*?)<\/tr><\/thead>([\s\S]*?)<\/tfoot>/,(m,hr,rest)=>{
  const cells=hr.replace(/<th([^>]*)>[\s\S]*?<\/th>/,'<td></td>').replace(/<th/g,'<td').replace(/<\/th>/g,'</td>');
  return `<thead><tr>${hr}</tr></thead>${rest}<tr class="foot-head no-print" aria-hidden="true">${cells}</tr></tfoot>`})}

/* ---------- actions ---------- */
async function addEntity(col,label,withPrice){
  const r=await modal({title:`إضافة ${label}`,body:`<label class="field"><span>اسم ${label}</span><input type="text" name="name"></label>${withPrice?'<label class="field"><span>الراتب الشهري (ر.س)</span><input type="text" name="price" inputmode="decimal"></label>':''}`,
    actions:[{key:'ok',label:'إضافة'},{key:'cancel',label:'إلغاء',cls:'ghost'}]});
  if(!r)return;const name=r.values.name.trim();
  if(!name){toast('اكتب الاسم');return}
  const o={name};
  if(withPrice){const p=num(r.values.price);if(!(p>=0)){toast('اكتب الراتب الشهري');return}o.salary=p;o.startMonth=curMonth();o.salaryHist=[{from:curMonth(),amount:p}]}
  if(await safe(()=>store.add(col,o)))toast(`تمت إضافة ${name}`);
}
async function editName(col,id){

  const r=await modal({title:`تعديل اسم ${c.label}`,body:`<label class="field"><span>الاسم</span><input type="text" name="name" value="${esc(ent.name)}"></label>`,

const ENT={branches:{label:'الفرع',child:'entries',fk:'branchId'},reps:{label:'المندوب',child:'repTx',fk:'repId'},workers:{label:'العامل',child:'workerTx',fk:'workerId'},customers:{label:'العميل',child:'custTx',fk:'custId'}};
const withDel=(html,col,id)=>`<div class="row-wrap">${html}<div class="row-btns"><button class="icon-btn edit-btn" data-act="editName" data-col="${col}" data-id="${id}" aria-label="تعديل الاسم">${svg('edit')}</button><button class="icon-btn del-btn" data-act="delEntity" data-col="${col}" data-id="${id}" aria-label="حذف">${svg('trash')}</button></div></div>`;
async function deleteEntity(col,id){
  const c=ENT[col],ent=S[col].find(x=>x.id===id);if(!ent)return;
  let kids=S[c.child].filter(x=>x[c.fk]===id);
  if(store.root&&WINDOWED.includes(c.child)){try{const sn=await store.root.collection(c.child).where(c.fk,'==',id).get();kids=sn.docs.map(d=>({...d.data(),id:d.id}))}catch(e){toast('تأكد من الاتصال بالإنترنت قبل الحذف');return}}
  const r=await modal({title:`حذف ${c.label} «${esc(ent.name)}»؟`,
    body:`<p>${kids.length?`سيُحذف ${c.label} ومعه <b>${kids.length}</b> سجل تابع له نهائيًا.`:`سيُحذف ${c.label} نهائيًا.`} يمكنك التراجع خلال ثوانٍ بعد الحذف.</p><label class="field"><span>للتأكيد اكتب كلمة <b>حذف</b></span><input type="text" name="confirm" autocomplete="off" placeholder="حذف"></label>`,
    actions:[{key:'del',label:'حذف نهائي',cls:'danger'},{key:'cancel',label:'إلغاء',cls:'ghost'}]});
  if(!r)return;
  if(r.values.confirm.replace(/\s/g,'')!=='حذف'){toast('لم يتم الحذف، يجب كتابة كلمة حذف');return}
  if(UI.detail&&UI.detail.id===id)go(UI.tab);
  if(await safe(async()=>{for(const k of kids)await store.remove(c.child,k.id);await store.remove(col,id)}))undoToast(`تم حذف ${ent.name}`,[{c:col,x:ent},...kids.map(k=>({c:c.child,x:k}))]);
}
/* سداد العميل مربوط بدخل اليومية: حذف أي واحد منهم يحذف الثاني، والتراجع يرجعهم مع بعض */
async function delLinked(col,id){const x=S[col].find(y=>y.id===id);if(!x){return delRow(col,id)}
  let other=null;
  if(col==='custTx'&&x.entryId)other={c:'entries',id:x.entryId,x:S.entries.find(y=>y.id===x.entryId)};
  if(col==='entries'){const t=(S.custTx||[]).find(y=>y.entryId===id);if(t)other={c:'custTx',id:t.id,x:t}}
  if(!other)return delRow(col,id);
  const docs=[{c:col,x}];if(other.x)docs.push({c:other.c,x:other.x});
  if(await safe(async()=>{await store.remove(col,id);await store.remove(other.c,other.id)}))undoToast(col==='custTx'?'تم حذف السداد ودخله من اليومية':'تم حذف الدخل وسداد العميل المرتبط به',docs)}
async function delRow(col,id,title){const x=S[col].find(y=>y.id===id);
  if(await safe(()=>store.remove(col,id))&&x)undoToast('تم الحذف',[{c:col,x}])}

/* ---------- ملف PDF (للآيفون: الطباعة من داخل التطبيق ما تشتغل فيه) ---------- */
const IS_IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const usePDF=()=>IS_IOS||window.FORCE_PDF===true;
function loadScript(src){return new Promise((res,rej)=>{const ex=document.querySelector(`script[data-src="${src}"]`);if(ex){ex.dataset.ok?res():ex.addEventListener('load',res);return}
  const s=document.createElement('script');s.src=src;s.dataset.src=src;s.onload=()=>{s.dataset.ok=1;res()};s.onerror=()=>{s.remove();rej(new Error('load'))};document.head.appendChild(s)})}
async function buildReportPDF(){
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
  if(document.fonts&&document.fonts.ready)await document.fonts.ready;
  const pm=[...document.body.classList].filter(c=>c.startsWith('pm-'));
  const root=document.createElement('div');root.className=['pdf-mode',...pm].join(' ');root.dir='rtl';
  root.style.cssText='position:absolute;left:-20000px;top:0;width:760px;background:#fff';
  const paged=!!$('#rBranches');if(paged)root.classList.add('pdf-paged');   // التقرير الشهري: كل قسم في صفحته
  root.innerHTML=$('#view').innerHTML;root.querySelectorAll('[id]').forEach(e=>e.removeAttribute('id'));
  document.body.appendChild(root);
  try{
    const blocks=[],vis=el=>getComputedStyle(el).display!=='none';
    const walk=el=>{for(const c of el.children){if(!vis(c))continue;if(c.hasAttribute('data-sec')||c.classList.contains('print-only')||(!paged&&c.classList.contains('charts')))walk(c);else blocks.push(c)}};   // الرسومات كل واحد لحاله عشان ما تنترك صفحات فاضية
    walk(root);
    const {jsPDF}=window.jspdf,pdf=new jsPDF({unit:'pt',format:'a4'});
    const PW=pdf.internal.pageSize.getWidth(),PH=pdf.internal.pageSize.getHeight(),M=28,CW=PW-2*M,BOT=PH-M;
    let y=M,pageUsed=false;
    const newPage=()=>{pdf.addPage();y=M;pageUsed=false};
    /* الطريقة العامة: كل قطعة ورا الثانية، والجدول الطويل يتقسم مع تكرار أسماء الأعمدة */
    const flow=async(list,fresh)=>{if(fresh&&pageUsed)newPage();
      const shots=[];
      for(const el of list){const cv=await html2canvas(el,{scale:2,backgroundColor:'#ffffff',logging:false,useCORS:true});if(!cv.width||!cv.height)continue;
        const top=el.getBoundingClientRect().top,sc=cv.height/el.getBoundingClientRect().height;
        const cuts=[...el.querySelectorAll('tr')].map(tr=>Math.round((tr.getBoundingClientRect().bottom-top)*sc));   // نقص الجدول بين الصفوف مو وسطها
        const th=el.querySelector('thead'),head=th?{y:Math.round((th.getBoundingClientRect().top-top)*sc),h:Math.round(th.getBoundingClientRect().height*sc)}:null;   // رأس الجدول يتكرر في كل صفحة
        shots.push({el,cv,h:cv.height*CW/cv.width,cuts,head})}
      for(let i=0;i<shots.length;i++){
        const {el,cv,h,cuts,head}=shots[i],k=CW/cv.width,gap=el.classList.contains('section-title')?4:10;
        if(el.classList.contains('pdf-newpage')&&pageUsed)newPage();
        if(el.classList.contains('section-title')&&pageUsed&&shots[i+1]){const nh=Math.min(shots[i+1].h,BOT-M-h-gap);if(y+h+gap+Math.max(nh,0)>BOT)newPage()}   // العنوان ما ينفصل عن اللي تحته
        const splitTable=cuts.length>3&&y+h>BOT&&BOT-y>160;   // جدول ما يكفيه الباقي من الصفحة: يكمل في الصفحة الجاية بدل ما يترك فراغ
        if(h<=BOT-M&&!splitTable){
          if(y+h>BOT)newPage();
          pdf.addImage(cv.toDataURL('image/jpeg',0.9),'JPEG',M,y,CW,h,undefined,'FAST');y+=h+gap;pageUsed=true;
        }else{                                                                      // جدول طويل: يتقسم على أكثر من صفحة
          let off=0;
          while(off<cv.height){
            if(BOT-y<120&&pageUsed)newPage();
            const rep=off>0&&head&&off>head.y+head.h;   // صفحة تكملة: نحط أسماء الأعمدة فوق
            if(rep){const hc=document.createElement('canvas');hc.width=cv.width;hc.height=head.h;hc.getContext('2d').drawImage(cv,0,head.y,cv.width,head.h,0,0,cv.width,head.h);
              pdf.addImage(hc.toDataURL('image/jpeg',0.9),'JPEG',M,y,CW,head.h*k,undefined,'FAST');y+=head.h*k}
            let sh=Math.min(Math.floor((BOT-y)/k),cv.height-off);
            if(off+sh<cv.height){const c=cuts.filter(v=>v>off+40&&v<=off+sh).pop();if(c)sh=c-off}
            const part=document.createElement('canvas');part.width=cv.width;part.height=sh;
            part.getContext('2d').drawImage(cv,0,off,cv.width,sh,0,0,cv.width,sh);
            pdf.addImage(part.toDataURL('image/jpeg',0.9),'JPEG',M,y,CW,sh*k,undefined,'FAST');
            off+=sh;y+=sh*k+gap;pageUsed=true;if(off<cv.height)newPage();
          }
        }
      }
    };
    /* صفحة كاملة لمجموعة أقسام: تتصغر لين تكفي الصفحة، ولو تحتاج تصغير كثير ترجع للطريقة العامة */
    const pageOf=async(list,minScale)=>{if(!list.length)return true;
      const wrap=document.createElement('div');wrap.className='pdf-pagewrap';list.forEach(e=>wrap.appendChild(e));root.appendChild(wrap);
      const cv=await html2canvas(wrap,{scale:2,backgroundColor:'#ffffff',logging:false,useCORS:true});
      const h=cv.height*CW/cv.width,sc=Math.min(1,(BOT-M)/h);
      if(sc<minScale){list.forEach(e=>root.insertBefore(e,wrap));wrap.remove();return false}
      if(pageUsed)newPage();const w=CW*sc;
      pdf.addImage(cv.toDataURL('image/jpeg',0.9),'JPEG',M+(CW-w)/2,y,w,h*sc,undefined,'FAST');y+=h*sc+10;pageUsed=true;wrap.remove();return true};
    if(paged){
      const G={charts:[],sum:[],days:[],workers:[],reps:[]};let cur='charts';
      for(const el of blocks){const t=el.classList.contains('section-title')?el.textContent.trim():'';
        if(t.includes('الملخص'))cur='sum';else if(t.includes('العمال'))cur='workers';else if(t.includes('المناديب'))cur='reps';
        if(!t&&el.querySelectorAll('tr').length>5&&(cur==='sum'||cur==='days')){G.days.push(el);cur='sum';continue}
        G[cur].push(el)}
      for(const k of ['charts','sum'])if(!(await pageOf(G[k],0.55)))await flow(G[k],true);
      if(!(await pageOf(G.days,0.6)))await flow(G.days,true);
      /* العمال والمناديب في صفحة وحدة، ولو ما كفّت كل واحد في صفحته */
      if(!(await pageOf(G.workers.concat(G.reps),0.85))){for(const k of ['workers','reps'])if(!(await pageOf(G[k],0.6)))await flow(G[k],true)}
    }else await flow(blocks,false);
    return pdf.output('blob');
  }finally{root.remove()}
}
async function sharePDF(name){
  toast('جارٍ تجهيز ملف PDF…');
  let blob;
  try{blob=await buildReportPDF()}catch(e){toast('تعذّر تجهيز الملف، تأكد من الاتصال بالإنترنت وحاول مرة أخرى');return}
  window.__lastPDF=blob;
  const file=new File([blob],name+'.pdf',{type:'application/pdf'}),url=URL.createObjectURL(blob);
  const canShare=!!(navigator.canShare&&navigator.canShare({files:[file]}));
  const p=modal({title:'ملف PDF جاهز',body:`<p>${canShare?'اضغط <b>مشاركة</b> واختر: حفظ في الملفات، أو طباعة، أو أرسله واتساب.':'اضغط <b>فتح الملف</b>، وبعدها تقدر تحفظه أو تطبعه.'}</p>`,
    actions:[...(canShare?[{key:'share',label:'مشاركة / حفظ / طباعة'}]:[]),{key:'open',label:'فتح الملف',cls:canShare?'ghost':''},{key:'cancel',label:'إغلاق',cls:'ghost'}]});
  // نربط الأزرار مباشرة عشان الآيفون يسمح بالمشاركة (لازم تكون من ضغطة المستخدم نفسها)
  const sb=document.querySelector('#modal-root [data-m=share]'),ob=document.querySelector('#modal-root [data-m=open]');
  if(sb)sb.addEventListener('click',()=>{navigator.share({files:[file],title:name}).catch(()=>{})});
  if(ob)ob.addEventListener('click',()=>{const w=window.open(url,'_blank');if(!w){const a=document.createElement('a');a.href=url;a.download=name+'.pdf';document.body.appendChild(a);a.click();a.remove()}});
  await p;setTimeout(()=>URL.revokeObjectURL(url),60000);
}

/* ===== البضاعة: كراتين وطاقات وأمتار، والتشييك. ما لها علاقة بالفلوس ولا اليومية ===== */
const gKey=c=>normPhone(c).toLowerCase().replace(/\s+/g,' ');
/* الشحنة نفسها محفوظة في نفس مجموعة goods (kind:'ship') عشان ما تحتاج تعديل قواعد Firestore، وكل كرتون فيه shipId */
const isShip=g=>g&&g.kind==='ship';
const shipList=()=>(S.goods||[]).filter(isShip).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.createdAt||0)-(a.createdAt||0));
const allCartons=()=>(S.goods||[]).filter(g=>!isShip(g));
const cartonsOf=sid=>allCartons().filter(g=>g.shipId===sid);
const gSort=(a,b)=>gKey(a.code).localeCompare(gKey(b.code),'en',{numeric:true})||(a.createdAt||0)-(b.createdAt||0);
/* نفس الصنف: كل صنف مكرر ياخذ لون، فالكراتين اللي لها نفس اللون نفس الصنف */
function goodsNames(list){const m={},col={};let i=0;list.forEach(g=>{const k=gKey(g.desc||'');if(k)m[k]=(m[k]||0)+1});
  Object.keys(m).sort((a,b)=>a.localeCompare(b,'en',{numeric:true})).forEach(k=>{if(m[k]>1)col[k]=i++%8});return{n:m,c:col}}
function goodsDupes(list){const m={};list.forEach(g=>{const k=gKey(g.code);if(k)m[k]=(m[k]||0)+1});return m}
function goodsTotals(list){let ctn=0,rolls=0,m=0;list.forEach(g=>{const c=g.cartons||1;ctn+=c;rolls+=(g.rolls||0)*c;m+=(g.meters||0)*c});return{ctn,rolls,m:Math.round(m*100)/100}}
/* الإدخال اليدوي: كل يوم شحنة وحدة رقمها ثابت (m-التاريخ)، فلو انشغلت الخطوة مرتين أو من جهازين ما تتكرر */
const gDay=t=>{const d=new Date(t);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
async function dayShip(d){const id='m-'+d;if(!(S.goods||[]).some(x=>x.id===id))await store.restore('goods',{id,kind:'ship',name:'بضاعة '+fmtShort(d),date:d,day:1,createdAt:Date.now()});return id}
/* الكراتين اللي بدون شحنة (أو انحطت غلط كل كرتون في «الشحنة الأولى» لحاله) ترجع لشحنة يومها */
let G_MIG=0;
async function goodsMigrate(){if(G_MIG>Date.now())return;
  const ships=shipList(),ids=new Set(ships.map(x=>x.id)),bad=ships.filter(x=>x.name==='الشحنة الأولى'&&!x.day),badIds=new Set(bad.map(x=>x.id));
  const orph=allCartons().filter(g=>!ids.has(g.shipId)||badIds.has(g.shipId));
  if(!orph.length&&!bad.length)return;
  G_MIG=Date.now()+5000;
  try{const by={};orph.forEach(g=>{let t=g.createdAt||Date.now();if(t<1.6e12)t=Date.now();(by[gDay(t)]=by[gDay(t)]||[]).push(g)});
    for(const d in by){const id=await dayShip(d);for(const g of by[d])if(g.shipId!==id)await store.update('goods',g.id,{shipId:id})}
    for(const x of bad)await store.remove('goods',x.id)}catch(e){}}
function goodsCard(g,dup,showShip,nm){const nk=gKey(g.desc||''),nn=nm&&nm.n[nk]||0,n=dup[gKey(g.code)]||0,c=g.cartons||1,sh=showShip&&(S.goods||[]).find(x=>x.id===g.shipId);
  return `<div class="g-card${g.st?' st-'+g.st:''}"><button class="g-main" data-act="editGoods" data-id="${g.id}">
    <div class="g-code"><b dir="auto">${esc(g.code)}</b>${g.desc?(nn>1?`<span class="g-same gc${nm.c[nk]}" dir="auto" title="${nn} كراتين بنفس الصنف">${esc(g.desc)} <b>×${nn}</b></span>`:`<span class="g-desc" dir="auto">${esc(g.desc)}</span>`):''}${n>1?`<span class="g-dup" title="هذا الرقم مسجل ${n} مرات في الشحنة">رقم مكرر ×${n}</span>`:''}</div>
    <div class="g-meta"><span>الطاقات <b class="mnum">${fmt(g.rolls||0)}</b></span><span>الكراتين <b class="mnum">${fmt(c)}</b></span><span>الأمتار <b class="mnum">${fmt(g.meters||0)}</b></span>${g.shade?`<span>اللون <b dir="auto">${esc(g.shade)}</b></span>`:''}</div>
    ${c>1?`<div class="g-sub">المجموع ${fmt((g.rolls||0)*c)} طاقة و ${fmt((g.meters||0)*c)} متر</div>`:''}
    ${g.note?`<div class="g-note">${esc(g.note)}</div>`:''}${sh?`<div class="g-ship">${svg('goods')}${esc(sh.name)}</div>`:''}</button>
    <div class="g-st"><button class="g-btn ok" data-act="gOk" data-id="${g.id}" aria-pressed="${g.st==='ok'}" aria-label="تم التشييك">✅</button><button class="g-btn issue" data-act="gIssue" data-id="${g.id}" aria-pressed="${g.st==='issue'}" aria-label="فيه خلل">❓</button></div></div>`}
function shipCard(sh){const c=cartonsOf(sh.id),T=goodsTotals(c),n=c.length,ok=c.filter(g=>g.st==='ok').length,bad=c.filter(g=>g.st==='issue').length;
  const pct=x=>n?(x/n*100).toFixed(1):0;
  return `<button class="ship-card" data-act="openShip" data-id="${sh.id}"><div class="sc-top"><h3>${esc(sh.name)}</h3>${sh.date?`<span>${fmtShort(sh.date)}</span>`:''}</div>
    <div class="g-meta"><span>الكراتين <b class="mnum">${fmt(T.ctn)}</b></span><span>الطاقات <b class="mnum">${fmt(T.rolls)}</b></span><span>الأمتار <b class="mnum">${fmt(T.m)}</b></span></div>
    ${n?`<div class="sc-bar" aria-hidden="true"><i class="ok" style="width:${pct(ok)}%"></i><i class="bad" style="width:${pct(bad)}%"></i></div>
    <div class="sc-st">${ok===n?'✅ تم تشييك كل الكراتين':`<span>✅ ${ok} من ${n}</span>`}${bad?`<span>❓ ${bad} فيها خلل</span>`:''}</div>`:'<div class="sc-st">لا توجد كراتين بعد</div>'}</button>`}
const shipFields=(sh={})=>`<label class="field"><span>اسم الشحنة</span><input type="text" name="name" value="${esc(sh.name||'')}" placeholder="مثل: فاتورة 89060 أو شحنة الهند"></label><label class="field"><span>تاريخ الوصول</span><input type="date" name="date" value="${sh.date||today()}"></label>`;
async function addShip(){
  const r=await modal({title:'شحنة جديدة',body:shipFields({name:'شحنة '+fmtShort(today())}),actions:[{key:'ok',label:'إنشاء الشحنة'},{key:'cancel',label:'إلغاء',cls:'ghost'}]});

async function editShip(id){const sh=(S.goods||[]).find(x=>x.id===id);if(!sh)return;

function goodsColType(t){t=normPhone(t).toLowerCase().replace(/\s+/g,' ').trim();if(!t)return null;

  if(/(\bshd|shade|colou?r|لون)/.test(t))return'shade';   // SHD / Shade = اللون أو رقم اللون

/* الطريقة 1: جدول بخطوط. نلقى الخطوط ونقرأ كل خانة لحالها */
function goodsLines(cv,W,H){
  const cx=cv.getContext('2d',{willReadFrequently:true}),d=cx.getImageData(0,0,W,H).data,g=new Uint8Array(W*H);
  for(let i=0;i<W*H;i++)g[i]=(d[i*4]*299+d[i*4+1]*587+d[i*4+2]*114)/1000;

  return{g,V,Hh}}
async function goodsGrid(cv,W,H,prog,mkWorker){

  const cc=document.createElement('canvas'),q=cc.getContext('2d',{willReadFrequently:true});

  const box=(r,c,loose)=>{const key=r+'_'+c+(loose?'L':'');if(key in BX)return BX[key];
    let x0=V[c]+2,x1=V[c+1]-1,y0=Hh[r]+2,y1=Hh[r+1]-1;
    const dk=(ax,ay,bx,by)=>{let n=0,t=0;for(let y=ay;y<by;y++)for(let x=ax;x<bx;x++){t++;if(g[y*W+x]<140)n++}return t?n/t:0};
    // بقايا خطوط الجدول على أطراف الخانة نشيلها

  const ws={};const getW=async l=>ws[l]||(ws[l]=await mkWorker(l));

    const bw=b.x1-b.x0,bh=b.y1-b.y0,k=Math.max(1,Math.min(4,Math.round(48/bh))),pad=20;
    cc.width=bw*k+pad*2;cc.height=bh*k+pad*2;q.fillStyle='#fff';q.fillRect(0,0,cc.width,cc.height);q.imageSmoothingQuality='high';q.drawImage(cv,b.x0,b.y0,bw,bh,pad,pad,bw*k,bh*k);
    const id=q.getImageData(0,0,cc.width,cc.height),gg=new Uint8Array(cc.width*cc.height),hist=new Array(256).fill(0);
    for(let i=0;i<gg.length;i++){gg[i]=(id.data[i*4]*299+id.data[i*4+1]*587+id.data[i*4+2]*114)/1000;hist[gg[i]]++}
    let sm=0;for(let t=0;t<256;t++)sm+=t*hist[t];let sB=0,wB=0,best=0,th=128;

          var tx=Math.min(Math.max((P.l+(selI+.5)*bw)*k,60),svg.getBoundingClientRect().width-60);tip.style.left=tx+'px';tip.style.top=(y(vals[selI])*k-6)+'px';box.appendChild(tip)}};
      draw(box1,'v',C.bar,160,true,'الدخل');
      draw(box1b,'o',C.out,105,false,'المصروف');
    }

    /* 2) المتراكم مقارنة بالشهر اللي قبل، لين اليوم لو الفترة ما خلصت */
    var end=b<today()?b:today(),box2=document.getElementById('ch2'),hero=document.getElementById('ch2H'),leg=document.getElementById('ch2L'),note=document.getElementById('ch2N');
    if(end<a){box2.innerHTML='<p class="chart-empty">الفترة لم تبدأ بعد.</p>';hero.innerHTML='';leg.innerHTML='';note.textContent=''}
    else{
      var cd=days(a,end),pe=prevMonthDay(end),pd=days(pa,pe);
      var pents=S.entries.filter(function(x){return x.kind==='in'&&inRange(x.date,pa,pe)});
      var cum=function(list,ds){var c=0;return ds.map(function(d){var t=sumEntries(list.filter(function(x){return x.date===d}));c+=t.in-t.fee;return c})};   // الدخل بعد العمولة، بدون المصروفات
      var cs=cum(ents,cd),ps=cum(pents,pd),n=Math.max(cs.length,ps.length);
      var oneMonth=a.slice(0,7)===b.slice(0,7);
      var curL=oneMonth?parseD(a).toLocaleDateString(LOC,{month:'long'}):'هذه الفترة',prvL=oneMonth?parseD(pa).toLocaleDateString(LOC,{month:'long'}):'الفترة السابقة';
      note.textContent='الدخل المتراكم بعد العمولة (كاش + مدى + فيزا) من '+fmtShort(a)+' حتى '+fmtShort(end)+'، مقارنةً بالأيام نفسها من الشهر السابق';
      var cl=cs[cs.length-1]||0,pl=ps[ps.length-1]||0,diff=cl-pl;
      var oldMissing=store.root&&typeof LOADED!=='undefined'&&typeof CUTOFF_M!=='undefined'&&pa.slice(0,7)<CUTOFF_M&&LOADED[pa.slice(0,7)]!==true;
      if(oldMissing){hero.innerHTML='<span class="d">جارٍ جلب بيانات الشهر الماضي…</span>'}
      else if(!pents.length){hero.innerHTML='<span class="chart-empty">لا توجد تسجيلات في '+esc2(prvL)+' للمقارنة.</span>'}
      else{var pc=pl?Math.round(diff/Math.abs(pl)*100):0;
        hero.innerHTML='<b dir="ltr">'+(diff>=0?'+':'−')+Math.abs(pc)+'%</b><span class="d '+(diff>=0?'up':'down')+'">'+(diff>=0?'▲ ':'▼ ')+fmt(Math.abs(diff))+' ر.س '+(diff>=0?'زيادة':'نقص')+'</span>'}
      var lo=Math.min(0,Math.min.apply(null,cs.concat(ps))),hi=Math.max(1,Math.max.apply(null,cs.concat(ps))),rg2=range(lo,hi);
      var iw2=W-P.l-P.r,ih2=H-P.t-P.b,x=function(i){return P.l+(n>1?i/(n-1):.5)*iw2},y2=function(v){return P.t+ih2-(v-rg2[0])/(rg2[1]-rg2[0])*ih2};
      var path=function(arr){return arr.map(function(v,i){return(i?'L':'M')+x(i).toFixed(1)+','+y2(v).toFixed(1)}).join('')};
      var s2='<svg viewBox="0 0 '+W+' '+H+'" direction="ltr" role="img" aria-label="مقارنة الدخل بالشهر الماضي">'+grid(rg2[0],rg2[1],y2);
      if(pents.length&&!oldMissing)s2+='<path d="'+path(ps)+'" fill="none" stroke="'+C.prev+'" stroke-width="2" stroke-dasharray="5 4"/>';
      s2+='<path d="'+path(cs)+'" fill="none" stroke="'+C.cur+'" stroke-width="2.2" stroke-linejoin="round"/>';
      var li=cs.length-1;s2+='<circle cx="'+x(li)+'" cy="'+y2(cl)+'" r="4.5" fill="'+C.cur+'" stroke="#fff" stroke-width="2"/>';
      var anchor=x(li)>W/2?'end':'start',dxl=anchor==='end'?-8:8,up=!pents.length||cl>=pl;
      s2+='<text x="'+(x(li)+dxl)+'" y="'+(y2(cl)+(up?-9:16))+'" font-size="11" font-weight="700" fill="'+C.ink+'" text-anchor="'+anchor+'" stroke="#fff" stroke-width="4" paint-order="stroke">'+fmt(Math.round(cl))+'</text>';
      if(pents.length&&!oldMissing){var pi=ps.length-1;s2+='<text x="'+(x(pi)+(x(pi)>W/2?-8:8))+'" y="'+(y2(pl)+(up?16:-9))+'" font-size="10.5" fill="'+C.muted+'" text-anchor="'+(x(pi)>W/2?'end':'start')+'" stroke="#fff" stroke-width="4" paint-order="stroke">'+fmt(Math.round(pl))+'</text>'}
      var lab=[0,Math.round((n-1)/3),Math.round(2*(n-1)/3),n-1].filter(function(v,i,arr){return arr.indexOf(v)===i});
      lab.forEach(function(i){s2+='<text x="'+x(i)+'" y="'+(H-6)+'" font-size="10" fill="'+C.muted+'" text-anchor="middle">'+parseD(shiftDay(a,i)).getDate()+'</text>'});
      box2.innerHTML=s2+'</svg>';
      leg.innerHTML='<span><i class="ln" style="border-color:'+C.cur+'"></i>'+esc2(curL)+'</span><span><i class="ln" style="border-color:'+C.prev+';border-top-style:dashed"></i>'+esc2(prvL)+'</span>';
    }

    /* 3) طرق الدفع */
    var T=sumEntries(ents),box3=document.getElementById('ch3');
    if(!T.in)box3.innerHTML='<p class="chart-empty">لا يوجد دخل في هذه الفترة.</p>';
    else{var parts=[['كاش',C.cash,T.cash||0],['مدى',C.mada,T.mada||0],['فيزا',C.visa,T.visa||0]];
      box3.innerHTML='<div class="pay-split">'+parts.filter(function(p){return p[2]>0}).map(function(p){return '<div style="flex:'+p[2]+';background:'+p[1]+'"></div>'}).join('')+'</div>'+
        '<div class="pay-rows">'+parts.map(function(p){return '<div><span><i style="background:'+p[1]+'"></i>'+p[0]+'</span><span><b>'+fmt(p[2])+' <small>ر.س</small></b><em>'+Math.round(p[2]/T.in*100)+'%</em></span></div>'}).join('')+'</div>'}
  };
  if(typeof UI!=='undefined'&&UI.tab==='report'&&!UI.detail&&typeof mount==='function')mount();
})();
</script>

<script>
/* تصنيف المصروفات حسب الملاحظة: كلمات معروفة، وأي تصنيف تختاره بنفسك ينحفظ ويتطبق على نفس الملاحظة بعدين */
var EXP_CATS=[
  ['رسوم حكومية',['اقامه','تاشيره','بلديه','رخصه','جوازات','مكتب العمل','غرامه','مخالفه','تامينات','تامين','زكاه','ضريبه','قوي','مقيم','تجديد','غرفه تجاريه','سجل']],
  ['فواتير واتصالات',['فاتوره','كهرب','انترنت','نت','شريحه','اتصالات','stc','موبايلي','زين','سوا','جوال']],
  ['إيجار',['ايجار','اجار','اجره المحل']],
  ['مأكولات ومشروبات',['فطور','فطار','غدا','عشا','فلافل','شاي','قهوه','كوفي','ماء','مويه','مياه','عصير','اكل','مطعم','بوفيه','سندويش','ساندويش','شاورما','برجر','خبز','تميس','تمر','حليب','ببسي','بيبسي','كولا','مشروب','وجبه','حلا','كيك','فول','بروست','دجاج','رز','بيتزا','ايسكريم','بسكويت','مكسرات']],
  ['نقل وتوصيل',['نقل','توصيل','مشوار','تاكسي','اوبر','كريم','بنزين','وقود','ديزل','شحن','سواق','ارامكس','سمسا','بريد','دباب','موقف','مواقف']],
  ['بضاعة وأقمشة',['قماش','اقمشه','بضاعه','جمله','شماغ','غتر','طواقي','طاقيه','بشت','تفصيل','خياط']],
  ['مستلزمات المحل',['كيس','اكياس','علاق','شماعه','شماعات','خيط','خيوط','زرار','ازرار','سحاب','ورق','قرطاسيه','طابعه','حبر','قلم','اقلام','شنط','شنطه','تغليف','كرتون','شريط','لاصق','بطاقات','ستيكر','مقص','ابر','عطر','بخور','دبابيس']],
  ['نظافة وصيانة',['تنظيف','منظف','صابون','مناديل','كلينكس','فلاش','معطر','مكنسه','صيانه','تصليح','سباك','كهربائي','مكيف','لمبه','لمبات','دهان','نجار','زجاج','قفل','مفتاح']]
];
var CAT_OTHER='أخرى';
var CAT_COLORS=['#7A2236','#A77826','#2A78D6','#2B7A57','#8C5BB5','#C2603A','#3F8C8C','#6A6884','#B04A75','#5C7A2B'];
function catNorm(t){return String(t||'').toLowerCase().replace(/[ً-ٰٟ]/g,'').replace(/[أإآا]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/ـ/g,'').replace(/\s+/g,' ').trim()}
function catKey(t){return catNorm(t).replace(/[\d٠-٩.,،]+/g,'').replace(/\s+/g,' ').trim()}
function catRuleId(k){var h=0;for(var i=0;i<k.length;i++){h=(h*31+k.charCodeAt(i))|0}return 'r'+(h>>>0).toString(36)+'_'+k.length}
function catOf(x){
  if(x.cat)return x.cat;
  var k=catKey(x.note);if(!k)return CAT_OTHER;
  var r=(S.catRules||[]).find(function(y){return y.k&&y.k===k});if(r)return r.cat;
  var hid=hiddenCats();
  var n=catNorm(x.note),ws=n.split(' ').map(function(w){return [w,w.replace(/^(و|ف|ب|لل|ل)?(ال)?/,'')]});
  /* الكلمة لازم تبدأ بالكلمة المعروفة (عشان «بنزين» ما تنحسب «زين» شركة الاتصالات) */
  var hit=function(k){k=k.trim();if(k.indexOf(' ')>=0)return n.indexOf(k)>=0;
    return ws.some(function(p){return k.length<=2?(p[0]===k||p[1]===k):(p[0].indexOf(k)===0||p[1].indexOf(k)===0)})};
  for(var i=0;i<EXP_CATS.length;i++){var c=EXP_CATS[i];if(hid.indexOf(c[0])<0&&c[1].some(hit))return c[0]}
  return CAT_OTHER}
/* الأنواع الأساسية اللي حذفتها (تنحفظ كسجل صغير، وتقدر تسترجعها) */
function hiddenCats(){return (S.catRules||[]).filter(function(y){return y.hide}).map(function(y){return y.hide})}
function catColor(c){var i=EXP_CATS.findIndex(function(x){return x[0]===c});if(i<0){var X=['#B04A75','#5C7A2B','#D08C2A','#4E6FAE','#9C6B4E'],h=0;for(var j=0;j<c.length;j++)h+=c.charCodeAt(j);return X[h%X.length]}return CAT_COLORS[i]}
function catList(){var hid=hiddenCats(),a=EXP_CATS.map(function(c){return c[0]}).filter(function(c){return hid.indexOf(c)<0});(S.catRules||[]).forEach(function(r){if(r.cat&&r.cat!==CAT_OTHER&&a.indexOf(r.cat)<0)a.push(r.cat)});
  (S.entries||[]).forEach(function(x){if(x.cat&&x.cat!==CAT_OTHER&&a.indexOf(x.cat)<0)a.push(x.cat)});a.push(CAT_OTHER);return a}
/* إدارة الأنواع: أي نوع ينحذف (الأساسي يتخبى ويقدر يرجع)، ومصروفاته ترجع للتصنيف التلقائي */
async function manageCats(){var L=catList().filter(function(c){return c!==CAT_OTHER}),H=hiddenCats(),base=EXP_CATS.map(function(c){return c[0]});
  var used=function(c){return (S.entries||[]).filter(function(x){return x.kind==='out'&&catOf(x)===c}).length};
  var r=await modal({title:'إدارة الأنواع',body:'<p>عند حذف نوع، تنتقل مصروفاته إلى «أخرى» أو إلى نوع آخر يطابقها.</p><div class="cm-list">'+L.map(function(c,i){return '<div class="cm-row"><span>'+esc(c)+'<small>'+used(c)+' مصروف'+(base.indexOf(c)<0?' · نوع مضاف':'')+'</small></span><button type="button" class="btn danger-ghost" data-m="del:'+i+'">حذف</button></div>'}).join('')+'</div>'+
      (H.length?'<p style="margin-top:14px">أنواع أساسية محذوفة:</p><div class="cm-list">'+H.map(function(c,i){return '<div class="cm-row off"><span>'+esc(c)+'</span><button type="button" class="btn ghost" data-m="res:'+i+'">استرجاع</button></div>'}).join('')+'</div>':''),
    actions:[{key:'cancel',label:'تم',cls:'ghost'}]});
  if(!r)return;
  if(r.key.indexOf('res:')===0){var h=H[+r.key.slice(4)],hd=(S.catRules||[]).find(function(y){return y.hide===h});
    if(hd&&await safe(function(){return store.remove('catRules',hd.id)}))toast('تم استرجاع «'+h+'»');setTimeout(manageCats,260);return}
  if(r.key.indexOf('del:')!==0)return;var c=L[+r.key.slice(4)];if(!c)return;
  var rules=(S.catRules||[]).filter(function(y){return y.cat===c}),ents=(S.entries||[]).filter(function(y){return y.cat===c});
  var docs=rules.map(function(y){return {c:'catRules',x:Object.assign({},y)}}).concat(ents.map(function(y){return {c:'entries',x:Object.assign({},y)}}));
  var isBase=base.indexOf(c)>=0,hideId='hide_'+catRuleId(c);
  if(await safe(async function(){for(var i=0;i<rules.length;i++)await store.remove('catRules',rules[i].id);for(var j=0;j<ents.length;j++)await store.update('entries',ents[j].id,{cat:null});
      if(isBase)await store.restore('catRules',{id:hideId,hide:c})})){
    undoToast('تم حذف نوع «'+c+'»',docs,isBase?function(){return store.remove('catRules',hideId)}:null);setTimeout(manageCats,260)}}
async function recatEntry(id){var x=S.entries.find(function(y){return y.id===id});if(!x)return;
  var cur=catOf(x),k=catKey(x.note),list=catList();
  var r=await modal({title:'نوع المصروف',body:'<p>'+(k?'«'+esc(x.note)+'» '+fmt(x.amount)+' ر.س. أي مصروف بالملاحظة نفسها لاحقًا سيُصنَّف في النوع الذي تختاره.':'مصروف بدون ملاحظة بـ '+fmt(x.amount)+' ر.س.')+'</p>'+
    '<div class="cat-opts">'+list.map(function(c){return '<label><input type="radio" name="cat" value="'+esc(c)+'"'+(c===cur?' checked':'')+'>'+esc(c)+'</label>'}).join('')+'</div>'+
    '<label class="field"><span>أو نوع جديد</span><input type="text" name="newcat" placeholder="مثال: ضيافة"></label>',
    actions:[{key:'ok',label:'حفظ'},{key:'manage',label:'إدارة الأنواع',cls:'ghost'},{key:'cancel',label:'إلغاء',cls:'ghost'}]});
  if(r&&r.key==='manage'){setTimeout(manageCats,260);return}
  if(!r)return;var c=(r.values.newcat||'').trim().slice(0,30)||r.values.cat;if(!c||c===cur)return;
  var ok=k?await safe(function(){return store.restore('catRules',{id:catRuleId(k),k:k,cat:c})}):await safe(function(){return store.update('entries',x.id,{cat:c})});
  if(ok)toast('أصبح «'+c+'»'+(k?' لكل «'+x.note+'»':''))}
(function(){
  if(typeof VIEWS==='undefined'||!VIEWS.report)return;
  var R=VIEWS.report,html0=R.html,upd0=R.update,open=null;
  R.html=function(){return html0().replace('</section><h2 class="section-title">الملخص</h2>',
    '<div class="chart-card"><h3>أنواع المصروفات</h3><p class="note no-print">اضغط على أي نوع لعرض تفاصيله، ويمكنك تغيير نوع أي مصروف. <button type="button" class="link-btn" id="catManage">إدارة الأنواع</button></p><div id="ch4"></div></div></section><h2 class="section-title">الملخص</h2>')};
  R.update=function(){upd0.apply(this,arguments);var box=document.getElementById('ch4');if(!box)return;
    var a=UI.rFrom,b=UI.rTo;if(a>b){var t=a;a=b;b=t}
    var outs=S.entries.filter(function(x){return x.kind==='out'&&inRange(x.date,a,b)});
    if(!outs.length){box.innerHTML='<p class="chart-empty">لا توجد مصروفات في هذه الفترة.</p>';return}
    var g={};outs.forEach(function(x){var c=catOf(x);(g[c]=g[c]||{c:c,t:0,l:[]}).t+=x.amount;g[c].l.push(x)});
    var rows=Object.keys(g).map(function(k){return g[k]}).sort(function(x,y){return (x.c===CAT_OTHER)-(y.c===CAT_OTHER)||y.t-x.t});
    var tot=outs.reduce(function(s,x){return s+x.amount},0),mx=Math.max.apply(null,rows.map(function(r){return r.t}));

  async function imageMonths(f){
